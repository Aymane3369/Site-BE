            theme: "Prise de décision et humilité intellectuelle",
            competences: ["Pensée critique", "Leadership", "Écoute"],
            content: `
                <div class="story">
                    Le roi Aldric avait vingt-deux ans lorsqu'il monta sur le trône de Valdoria. Il était intelligent, cultivé, et il le savait. Il avait lu tous les livres de la bibliothèque royale, mémorisé les traités de stratégie, et il considérait ses conseillers comme des vieillards trop lents, trop prudents, trop... inutiles.
                </div>

                <p>Il les congédia tous. "Un roi digne de ce nom n'a pas besoin de conseillers", déclara-t-il devant la cour. "Je vois clair, je comprends tout, et je déciderai seul."</p>

                <p>Les premières semaines furent glorieuses. Il prit des décisions rapides, trancha des conflits, imposa sa volonté. Le peuple l'admirait. Mais les premiers signes de fragilité apparurent. Il décida d'augmenter les impôts pour financer une armée qu'il jugeait nécessaire. Ses anciens conseillers, s'ils avaient été là, auraient souligné que les récoltes étaient mauvaises et que le peuple souffrait déjà. Mais il ne les écoutait plus.</p>

                <p>La révolte gronde. Il la réprima durement, persuadé que la force était la seule réponse. Puis vint la guerre avec le royaume voisin. Il avait prévu une attaque rapide, mais il n'avait pas anticipé que ses généraux, frustrés par son mépris, exécuteraient ses ordres sans enthousiasme. L'armée fut vaincue.</p>

                <p>Le royaume était au bord du chaos. Aldric, seul dans sa chambre, regarda les cartes, les rapports, les lettres de détresse. Il avait tout perdu, non pas parce qu'il était faible, mais parce qu'il croyait que son intelligence suffisait à tout. Il fit venir ses anciens conseillers. "Je ne vous demande pas de me sauver", dit-il. "Je vous demande de me dire ce que je n'ai pas vu."</p>

                <p>L'un d'eux, le plus âgé, répondit : "Vous n'avez pas vu que le pouvoir n'est pas une question de connaissance, mais de perception. Vous n'avez pas vu que la sagesse ne se trouve pas dans les livres, mais dans la diversité des regards. Vous n'avez pas vu que votre plus grand ennemi n'était pas l'armée adverse, mais votre propre certitude."</p>

                <p>Aldric écouta. Pour la première fois, il écouta vraiment. Il mit en œuvre des réformes, apaisa le peuple, négocia la paix. Il avait appris que le véritable pouvoir ne réside pas dans la certitude, mais dans l'humilité de savoir que l'on peut toujours apprendre.</p>

                <div class="analyse">
                    <h5>🔍 Analyse des décisions d'Aldric</h5>
                    <p>Aldric a commis l'erreur classique du "biais de surconfiance". Il a surestimé ses propres capacités et sous-estimé la valeur des autres. Ses décisions étaient cohérentes avec sa vision, mais elles manquaient de perspectives alternatives.</p>
                    <p>Il a également confondu <strong>intelligence individuelle</strong> et <strong>intelligence collective</strong>. La première est utile, la seconde est nécessaire. Un leader qui s'isole intellectuellement se prive de la diversité des points de vue qui permet d'anticiper les risques.</p>
                </div>

                <div class="dilemme">
                    <h5>⚖️ Dilemme</h5>
                    <p>Si vous étiez Aldric au début de son règne, auriez-vous congédié les conseillers ? Comment trouver l'équilibre entre confiance en soi et écoute des autres ?</p>
                </div>

                <h4>❓ Questions de réflexion</h4>
                <ul>
                    <li>Pourquoi Aldric a-t-il rejeté ses conseillers ? Quelles croyances le motivaient ?</li>
                    <li>À quel moment aurait-il pu éviter la crise ?</li>
                    <li>Dans votre vie, avez-vous déjà rejeté un conseil important que vous auriez dû écouter ?</li>
                    <li>Comment distinguer un bon conseil d'un mauvais ?</li>
                </ul>

                <h4>📚 Liens avec des notions</h4>
                <ul>
                    <li><strong>Psychologie :</strong> Biais de confirmation — nous avons tendance à privilégier les informations qui confirment nos croyances.</li>
                    <li><strong>Leadership :</strong> Les meilleurs leaders s'entourent de personnes qui pensent différemment d'eux.</li>
                    <li><strong>Éthique :</strong> La responsabilité d'un leader inclut l'humilité de reconnaître ses limites.</li>
                </ul>
            `

            id: 2,
            title: "Les Trois Marchands",
            theme: "Économie et stratégie",
            competences: ["Finances", "Investissement", "Gestion des risques"],
            content: `
                <div class="story">
                    Dans la cité d'Argos, trois jeunes marchands reçurent chacun cent pièces d'or de leur père. Ils avaient dix-huit ans, les mêmes ressources, les mêmes opportunités. Dix ans plus tard, leurs fortunes étaient radicalement différentes. Leurs chemins offrent une leçon sur la manière dont les décisions, les habitudes et la vision façonnent le destin.
                </div>

                <p><strong>Le premier marchand, Lucius,</strong> dépensa son argent rapidement. Il acheta des vêtements luxueux, des esclaves, et se fit construire une maison. Il pensait que le succès viendrait de son apparence et de ses relations. Il fit des affaires, mais toujours à court terme, toujours dans l'urgence. Ses affaires déclinèrent, et il passa le reste de sa vie à travailler pour les autres.</p>

                <p><strong>Le second marchand, Marcus,</strong> prit des risques. Il investit dans un navire qui partait pour une terre lointaine. L'affaire était risquée, mais les bénéfices potentiels étaient énormes. Le navire coula dans une tempête. Marcus perdit tout. Il ne pouvait pas se permettre de réessayer.</p>

                <p><strong>Le troisième marchand, Titus,</strong> prit son temps. Il observa. Il apprit. Il investit cent pièces dans des épices qu'il vendit à profit. Il réinvestit. Il ne dépensait pas ce qu'il gagnait, il le faisait fructifier. Il diversifia ses investissements, apprit à gérer ses risques, et au bout de dix ans, il possédait une flotte de navires et une fortune immense.</p>

                <p>Lucius avait été imprévoyant. Marcus avait été imprudent. Titus avait été patient et stratégique.</p>

                <div class="analyse">
                    <h5>🔍 Analyse des trois stratégies</h5>
                    <p><strong>Lucius</strong> a confondu <strong>richesse et apparence</strong>. Il a privilégié la consommation immédiate sur l'investissement à long terme. C'est l'erreur du "court-termisme".</p>
                    <p><strong>Marcus</strong> a fait le pari inverse : tout risquer sur une seule opportunité. C'est l'erreur du "tout ou rien". Sans diversification, la moindre défaillance est fatale.</p>
                    <p><strong>Titus</strong> a combiné <strong>patience, apprentissage et diversification</strong>. Il a compris que la richesse ne se crée pas par un coup de chance, mais par une accumulation de bonnes décisions.</p>
                </div>

                <div class="dilemme">
                    <h5>⚖️ Dilemme</h5>
                    <p>Entre les trois approches, laquelle vous semble la plus naturelle ? Comment trouver le bon équilibre entre consommation, risque et épargne ?</p>
                </div>

                <h4>❓ Questions de réflexion</h4>
                <ul>
                    <li>Pourquoi Titus a-t-il réussi là où les deux autres ont échoué ?</li>
                    <li>Quelle est la différence entre prendre un risque et être imprudent ?</li>
                    <li>Comment les habitudes quotidiennes influencent-elles notre situation financière ?</li>
                    <li>Que feriez-vous si vous receviez 100 euros aujourd'hui ?</li>
                </ul>

                <h4>📚 Liens avec des notions</h4>
                <ul>
                    <li><strong>Économie :</strong> L'effet boule de neige des intérêts composés.</li>
                    <li><strong>Psychologie :</strong> La gratification différée est un indicateur de succès.</li>
                    <li><strong>Gestion des risques :</strong> La diversification est le seul "repas gratuit" en finance.</li>
                </ul>
            `
        }, {

            title: "L'Architecte Invisible",
            theme: "Vision à long terme",
            competences: ["Planification", "Durabilité", "Responsabilité"],
            content: `
                <div class="story">
                    Le grand architecte Kael avait été convié à la cour du roi pour concevoir une nouvelle ville. Il avait les plans, les calculs, les matériaux. Mais il demanda un délai supplémentaire de six mois. Les courtisans se moquèrent. "Il est vieux, il est lent, il n'a plus le talent d'autrefois."
                </div>

                <p>Six mois plus tard, Kael revint avec des plans qui semblaient simples, trop simples. Le roi fut déçu. Mais Kael expliqua : "J'ai conçu chaque rue pour qu'elle soit traversée par le vent, chaque fontaine pour qu'elle soit alimentée par des sources naturelles, chaque bâtiment pour qu'il puisse être agrandi sans être détruit. Cette ville n'est pas pour vous, Sire, ni pour moi. Elle est pour ceux qui viendront après nous."</p>

                <p>Le roi, sceptique, lui donna l'autorisation de construire. Vingt ans plus tard, la ville prospérait. Les bâtiments étaient encore solides, les rues encore agréables. Cinquante ans plus tard, la ville était un modèle d'urbanisme. Cent ans plus tard, les historiens cherchaient encore le nom de son architecte.</p>

                <p>Kael avait construit pour les générations futures, sans chercher la gloire immédiate.</p>

                <div class="analyse">
                    <h5>🔍 Analyse de la vision de Kael</h5>
                    <p>Kael a fait un choix fondamental : <strong>concevoir pour la durabilité plutôt que pour l'effet immédiat</strong>. Il a anticipé les besoins futurs, les extensions possibles, les défis climatiques. Il a construit non pas pour plaire à son roi, mais pour servir une communauté sur le long terme.</p>
                    <p>Cette approche exige une <strong>résistance à la pression sociale</strong> (les courtisans le critiquaient) et une <strong>confiance en sa propre vision</strong> (il savait que les résultats ne seraient visibles que bien après sa mort).</p>

                <div class="dilemme">

                </div>

                <h4>❓ Questions de réflexion</h4>
                <ul>
                    <li>Pourquoi Kael a-t-il pris le temps de concevoir une ville durable ?</li>
                    <li>Qu'est-ce qui est plus important : la reconnaissance immédiate ou l'impact à long terme ?</li>
                    <li>Dans quels domaines de votre vie pourriez-vous adopter une vision à long terme ?</li>
                    <li>Comment résister à la pression des résultats immédiats ?</li>
                </ul>

                <h4>📚 Liens avec des notions</h4>

                    <li><strong>Éthique :</strong> La responsabilité envers les générations futures.</li>
                    <li><strong>Économie :</strong> La valeur des investissements à long terme.</li>
                    <li><strong>Leadership :</strong> La capacité à résister à la pression du court-terme.</li>
                </ul>
            `

            id: 4,
            title: "Le Procès des Vérités",
            theme: "Esprit critique",
            competences: ["Analyse", "Logique", "Objectivité"],
            content: `
                <div class="story">
                    Dans la ville de Veridia, un crime avait été commis. Un bijou de grande valeur avait disparu du palais du gouverneur. Cinq témoins furent convoqués. Chacun raconta une version différente. Le juge, un homme sage, décida de les écouter tous avant de rendre son verdict.
                </div>

                <p><strong>Le premier témoin</strong>, le gardien, affirma avoir vu un homme en noir s'enfuir par la fenêtre. <strong>Le second</strong>, une servante, jura que le voleur était une femme, car elle avait vu une jupe. <strong>Le troisième</strong>, un marchand, déclara avoir entendu deux voix. <strong>Le quatrième</strong>, un enfant, dit qu'il n'y avait personne. <strong>Le cinquième</strong>, un noble, accusa le gardien lui-même.</p>

                <p>Le juge ne condamna personne sur-le-champ. Il demanda à chaque témoin de raconter l'histoire non pas une fois, mais trois fois. Il croisa les détails, chercha les incohérences, confronta les versions. Il découvrit que chacun avait vu une partie de la vérité, mais que leurs perceptions étaient déformées par leurs préjugés, leurs peurs, leurs intérêts.</p>

                <p>Il reconstitua ce qui s'était réellement passé : un voleur expérimenté, assisté d'un complice, avait utilisé une diversion. Le bijou avait été emporté par un troisième complice, invisible pour tous.</p>

                <p>Le juge déclara : "La vérité n'est pas ce qu'un seul témoin raconte. Elle est ce qui émerge quand on confronte les versions, quand on cherche les contradictions, quand on accepte que personne ne voit tout."</p>

                <div class="analyse">
                    <h5>🔍 Analyse des versions</h5>
                    <p>Chaque témoin a donné une version <strong>partiellement vraie</strong>, mais <strong>complètement déformée</strong> par son point de vue. Le gardien a vu un homme, mais il était de nuit. La servante a vu une jupe, mais c'était un complice déguisé. Le marchand a entendu deux voix, mais il a mal interprété la situation.</p>
                    <p>Cette histoire illustre le <strong>phénomène des témoignages</strong> en psychologie : notre mémoire reconstruit les événements en fonction de nos attentes, de nos émotions et de nos croyances.</p>
                </div>

                <div class="dilemme">
                    <h5>⚖️ Dilemme</h5>
                    <p>Comment savoir si une information est fiable ? Si plusieurs sources contradictoires existent, comment trancher ?</p>
                </div>

                <h4>❓ Questions de réflexion</h4>
                <ul>
                    <li>Pourquoi les cinq témoins ont-ils donné des versions différentes ?</li>
                    <li>Qu'est-ce qui influence notre perception des événements ?</li>
                    <li>Comment vérifier la fiabilité d'une information ?</li>
                    <li>Dans votre vie, avez-vous déjà découvert que "votre vérité" n'était que partielle ?</li>
                </ul>

                <h4>📚 Liens avec des notions</h4>
                <ul>
                    <li><strong>Psychologie :</strong> Biais cognitifs, mémoire reconstructive.</li>
