<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BeIN Sports Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #0a0e1a;
            color: #fff;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            padding: 20px 0 30px;
            font-size: 2.2rem;
            background: linear-gradient(135deg, #f7b731, #f5a623);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 2px;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 18px 16px 16px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
            display: flex;
            flex-direction: column;
        }
        .card:hover {
            transform: translateY(-6px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.6);
            border-color: #f7b731;
        }
        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            color: #f7b731;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .card-title .badge {
            background: #f7b731;
            color: #0a0e1a;
            font-size: 0.6rem;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 20px;
        }
        .card-url {
            font-size: 0.65rem;
            color: #8892b0;
            word-break: break-all;
            background: rgba(0, 0, 0, 0.3);
            padding: 6px 10px;
            border-radius: 8px;
            margin: 6px 0 10px;
            font-family: 'Courier New', monospace;
            line-height: 1.4;
        }
        .card-stream {
            font-size: 0.8rem;
            color: #a8b2d1;
            background: rgba(247, 183, 49, 0.08);
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            align-self: flex-start;
            margin-top: 4px;
            border: 1px solid rgba(247, 183, 49, 0.15);
        }
        .btn-play {
            margin-top: 12px;
            padding: 10px 0;
            background: #f7b731;
            border: none;
            border-radius: 30px;
            font-weight: 700;
            color: #0a0e1a;
            font-size: 0.9rem;
            cursor: pointer;
            transition: background 0.2s ease, transform 0.1s ease;
            text-align: center;
        }
        .btn-play:hover {
            background: #f5a623;
            transform: scale(1.02);
        }
        .player-container {
            margin-top: 40px;
            background: rgba(0, 0, 0, 0.6);
            border-radius: 20px;
            padding: 20px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            display: none;
        }
        .player-container.active {
            display: block;
        }
        .player-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            flex-wrap: wrap;
            gap: 10px;
        }
        .player-header h3 {
            color: #f7b731;
            font-weight: 500;
            font-size: 1.2rem;
        }
        .player-header .close-btn {
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            padding: 6px 16px;
            border-radius: 30px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: background 0.2s;
        }
        .player-header .close-btn:hover {
            background: rgba(255, 70, 70, 0.3);
        }
        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            max-height: 70vh;
            display: block;
        }
        .stats {
            text-align: center;
            margin-top: 20px;
            color: #5a6a8a;
            font-size: 0.85rem;
        }
        .stats span {
            color: #f7b731;
            font-weight: 600;
        }
        .error-msg {
            color: #ff6b6b;
            text-align: center;
            padding: 10px;
            background: rgba(255, 0, 0, 0.1);
            border-radius: 8px;
            margin-top: 10px;
            display: none;
        }
        .loading-msg {
            text-align: center;
            padding: 10px;
            color: #f7b731;
            display: none;
        }
        .player-status {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #8892b0;
        }
        .player-status .status-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            border-radius: 50%;
            margin-right: 6px;
        }
        .status-dot.loading {
            background: #f7b731;
            animation: pulse 1s infinite;
        }
        .status-dot.playing {
            background: #4caf50;
        }
        .status-dot.error {
            background: #ff6b6b;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        @media (max-width: 600px) {
            h1 { font-size: 1.6rem; }
            .grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚽ BeIN SPORTS · 4K & HD</h1>
        <div id="playlistGrid" class="grid"></div>
        
        <div id="playerContainer" class="player-container">
            <div class="player-header">
                <h3 id="currentChannelName">📺 Chaîne</h3>
                <button class="close-btn" id="closePlayer">✕ Fermer</button>
            </div>
            <video id="videoPlayer" controls autoplay playsinline></video>
            <div id="playerError" class="error-msg"></div>
            <div id="playerLoading" class="loading-msg">⏳ Chargement du flux...</div>
            <div class="player-status">
                <span><span class="status-dot" id="statusDot"></span><span id="statusText">Prêt</span></span>
            </div>
        </div>
        <div class="stats">🔹 <span id="channelCount">0</span> chaînes disponibles</div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/hls.js@0.14.17/dist/hls.min.js"></script>
    <script>
        (function() {
            const channelsData = [
                { name: "BEIN SPORTS 1 4K", url: "http://80.211.189.193/live/get.php?stream=27&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 2 4K", url: "http://80.211.189.193/live/get.php?stream=28&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 3 4K", url: "http://80.211.189.193/live/get.php?stream=29&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 4 4K", url: "http://80.211.189.193/live/get.php?stream=30&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 5 4K", url: "http://80.211.189.193/live/get.php?stream=31&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 6 4K", url: "http://80.211.189.193/live/get.php?stream=32&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 7 4K", url: "http://80.211.189.193/live/get.php?stream=33&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 8 4K", url: "http://80.211.189.193/live/get.php?stream=34&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 1 HD", url: "http://80.211.189.193/live/get.php?stream=17&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 2 HD", url: "http://80.211.189.193/live/get.php?stream=18&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 3 HD", url: "http://80.211.189.193/live/get.php?stream=19&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 4 HD", url: "http://80.211.189.193/live/get.php?stream=20&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 5 HD", url: "http://80.211.189.193/live/get.php?stream=21&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 6 HD", url: "http://80.211.189.193/live/get.php?stream=22&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 7 HD", url: "http://80.211.189.193/live/get.php?stream=23&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 8 HD", url: "http://80.211.189.193/live/get.php?stream=24&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 9 HD", url: "http://80.211.189.193/live/get.php?stream=25&username=76097116161695&password=76097116161695" },
                { name: "BEIN SPORTS 10 HD", url: "http://80.211.189.193/live/get.php?stream=26&username=76097116161695&password=76097116161695" }
            ];

            const grid = document.getElementById('playlistGrid');
            const playerContainer = document.getElementById('playerContainer');
            const videoPlayer = document.getElementById('videoPlayer');
            const currentChannelName = document.getElementById('currentChannelName');
            const closeBtn = document.getElementById('closePlayer');
            const channelCountSpan = document.getElementById('channelCount');
            const playerError = document.getElementById('playerError');
            const playerLoading = document.getElementById('playerLoading');
            const statusDot = document.getElementById('statusDot');
            const statusText = document.getElementById('statusText');

            let hls = null;
            let currentHlsUrl = '';

            function updateStatus(state, message) {
                statusDot.className = 'status-dot ' + state;
                statusText.textContent = message;
            }

            function renderChannels() {
                if (!channelsData.length) {
                    grid.innerHTML = `<div style="text-align:center;padding:40px;color:#8892b0;">Aucune chaîne disponible.</div>`;
                    channelCountSpan.textContent = '0';
                    return;
                }

                channelCountSpan.textContent = channelsData.length;
                grid.innerHTML = '';

                channelsData.forEach((ch) => {
                    const card = document.createElement('div');
                    card.className = 'card';

                    const is4K = ch.name.includes('4K');
                    const isHD = ch.name.includes('HD') && !is4K;

                    const title = document.createElement('div');
                    title.className = 'card-title';
                    title.innerHTML = `
                        <span>${ch.name}</span>
                        ${is4K ? '<span class="badge">4K</span>' : ''}
                        ${isHD ? '<span class="badge">HD</span>' : ''}
                    `;

                    const urlDiv = document.createElement('div');
                    urlDiv.className = 'card-url';
                    urlDiv.textContent = ch.url.length > 60 ? ch.url.substring(0, 60) + '…' : ch.url;

                    const streamMatch = ch.url.match(/stream=([^&]+)/);
                    const streamBadge = document.createElement('div');
                    streamBadge.className = 'card-stream';
                    streamBadge.textContent = streamMatch ? `Stream: ${streamMatch[1]}` : 'Stream';

                    const btn = document.createElement('button');
                    btn.className = 'btn-play';
                    btn.textContent = '▶ Lire';
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        playChannel(ch.url, ch.name);
                    });

                    card.appendChild(title);
                    card.appendChild(urlDiv);
                    card.appendChild(streamBadge);
                    card.appendChild(btn);
                    grid.appendChild(card);
                });
            }

            function playChannel(url, name) {
                // Nettoyer l'URL
                let cleanUrl = url.trim();
                if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
                    cleanUrl = 'http://' + cleanUrl;
                }
                cleanUrl = cleanUrl.replace(/\s/g, '');

                console.log('📺 Tentative de lecture:', cleanUrl);

                // Réinitialiser
                playerError.style.display = 'none';
                playerError.textContent = '';
                playerLoading.style.display = 'block';
                updateStatus('loading', 'Chargement...');

                // Détruire l'ancien HLS si présent
                if (hls) {
                    hls.destroy();
                    hls = null;
                }

                // Vider la vidéo
                videoPlayer.pause();
                videoPlayer.removeAttribute('src');
                videoPlayer.load();

                currentHlsUrl = cleanUrl;
                currentChannelName.textContent = `📺 ${name}`;
                playerContainer.classList.add('active');

                // Détecter si c'est un flux HLS (m3u8) ou un flux direct
                const isHls = cleanUrl.includes('.m3u8') || cleanUrl.includes('m3u8');

                if (isHls || Hls.isSupported()) {
                    // Utiliser HLS.js pour les flux m3u8 ou si le navigateur ne supporte pas native HLS
                    if (Hls.isSupported()) {
                        hls = new Hls({
                            enableWorker: true,
                            lowLatencyMode: true,
                            backbufferLength: 30,
                            maxBufferLength: 60,
                            maxMaxBufferLength: 600,
                        });

                        hls.loadSource(cleanUrl);
                        hls.attachMedia(videoPlayer);

                        hls.on(Hls.Events.MANIFEST_PARSED, function() {
                            playerLoading.style.display = 'none';
                            updateStatus('playing', 'En cours de lecture');
                            videoPlayer.play().catch(e => {
                                console.warn('Lecture automatique bloquée:', e);
                            });
                        });

                        hls.on(Hls.Events.ERROR, function(event, data) {
                            if (data.fatal) {
                                playerLoading.style.display = 'none';
                                updateStatus('error', 'Erreur');
                                playerError.textContent = '❌ Erreur fatale: Impossible de lire ce flux HLS. Vérifiez que le serveur est accessible.';
                                playerError.style.display = 'block';
                                console.error('Erreur HLS fatale:', data);
                            }
                        });

                        // Détection de fin de flux
                        hls.on(Hls.Events.FRAG_LOADING, function() {
                            updateStatus('playing', 'Lecture...');
                        });

                    } else if (videoPlayer.canPlayType('application/vnd.apple.mpegurl')) {
                        // Safari supporte nativement HLS
                        videoPlayer.src = cleanUrl;
                        videoPlayer.addEventListener('loadedmetadata', function() {
                            playerLoading.style.display = 'none';
                            updateStatus('playing', 'En cours de lecture');
                            videoPlayer.play().catch(e => console.warn(e));
                        });
                        videoPlayer.addEventListener('error', function() {
                            playerLoading.style.display = 'none';
                            updateStatus('error', 'Erreur');
                            playerError.textContent = '❌ Erreur de lecture native HLS.';
                            playerError.style.display = 'block';
                        });
                    }
                } else {
                    // Flux direct (MP4, etc.)
                    videoPlayer.src = cleanUrl;
                    videoPlayer.addEventListener('loadedmetadata', function() {
                        playerLoading.style.display = 'none';
                        updateStatus('playing', 'En cours de lecture');
                        videoPlayer.play().catch(e => console.warn(e));
                    });
                    videoPlayer.addEventListener('error', function(e) {
                        playerLoading.style.display = 'none';
                        updateStatus('error', 'Erreur');
                        playerError.textContent = `❌ Erreur ${videoPlayer.error ? videoPlayer.error.code : ''}: Impossible de lire ce flux. Vérifiez que l'URL est valide.`;
                        playerError.style.display = 'block';
                        console.error('Erreur vidéo:', videoPlayer.error);
                    });
                    videoPlayer.addEventListener('stalled', function() {
                        updateStatus('loading', 'Rebuffering...');
                    });
                    videoPlayer.addEventListener('playing', function() {
                        updateStatus('playing', 'Lecture...');
                        playerLoading.style.display = 'none';
                    });
                }

                // Timeout pour le chargement
                setTimeout(() => {
                    if (playerLoading.style.display !== 'none') {
                        playerLoading.style.display = 'none';
                        updateStatus('error', 'Délai dépassé');
                        playerError.textContent = '⏱️ Délai de chargement dépassé. Le serveur est peut-être indisponible.';
                        playerError.style.display = 'block';
                    }
                }, 15000);

                playerContainer.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }

            function closePlayer() {
                if (hls) {
                    hls.destroy();
                    hls = null;
                }
                videoPlayer.pause();
                videoPlayer.removeAttribute('src');
                videoPlayer.load();
                playerContainer.classList.remove('active');
                playerError.style.display = 'none';
                playerLoading.style.display = 'none';
                updateStatus('', 'Prêt');
            }

            closeBtn.addEventListener('click', closePlayer);

            // Gestion de la fermeture avec la touche Echap
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && playerContainer.classList.contains('active')) {
                    closePlayer();
                }
            });

            // Initialisation
            renderChannels();
            console.log(`✅ ${channelsData.length} chaînes BeIN chargées.`);
        })();
    </script>
</body>
</html>
