      { id: 4, verif: 'VE', qSR: 'Citez un endroit où l\'on peut trouver les pressions préconisées pour les pneumatiques ?', rSR: 'Elles sont indiquées — soit sur une plaque sur une portière — soit dans la notice d\'utilisation du véhicule — soit au niveau de la trappe à carburant.', qPS: 'Sur autoroute, comment indiquer avec précision les lieux de l\'accident depuis un téléphone portable ?', rPS: 'En indiquant le numéro de l\'autoroute, le sens de circulation et le point kilométrique.' },
      { id: 5, verif: 'VI', qSR: 'Comment détecter l\'usure des essuie-glaces en circulation ?', rSR: 'En cas de pluie, lorsqu\'ils laissent des traces sur le pare-brise.', qPS: 'Comment vérifier la respiration d\'une victime ?', rPS: 'Regarder si le ventre et la poitrine se soulèvent et sentir de l\'air à l\'expiration.' },
      { id: 6, verif: 'VE', qSR: 'Quelles sont les précautions à prendre en cas d\'installation d\'un porte-vélo ?', rSR: 'La plaque d\'immatriculation et les feux doivent être visibles.', qPS: 'Qu\'est-ce qu\'une perte de connaissance ?', rPS: 'C\'est lorsque la victime ne répond pas et ne réagit pas, mais respire.' },
      { id: 7, verif: 'VI', qSR: 'En cas de panne ou d\'accident, quel autre accessoire de sécurité est obligatoire ? (Autre que le gilet de haute visibilité)', rSR: 'Le triangle de pré-signalisation.', qPS: 'Si un dégagement d\'urgence de la victime est nécessaire, où doit-elle être déplacée ?', rPS: 'Dans un endroit suffisamment éloigné du danger et de ses conséquences.' },
      { id: 8, verif: 'VE', qSR: 'Quelle est la conséquence d\'un niveau insuffisant du liquide de frein ?', rSR: 'Une perte d\'efficacité du freinage.', qPS: 'En cas de panne ou d\'accident, quel équipement de sécurité doit être porté avant de quitter le véhicule ?', rPS: 'Il faut porter le gilet de haute visibilité avant de sortir du véhicule.' },
      { id: 9, verif: 'VI', qSR: 'Quels sont les deux autres documents obligatoires à présenter en cas de contrôle par les forces de l\'ordre ? (Autre que la carte grise)', rSR: 'L\'attestation d\'assurance et le permis de conduire.', qPS: 'Pourquoi l\'alerte auprès des services de secours doit-elle être rapide et précise ?', rPS: 'Pour permettre aux services de secours d\'apporter les moyens adaptés aux victimes dans le délai le plus court.' },
      { id: 10, verif: 'VE', qSR: 'Quel est le risque de circuler avec des balais d\'essuie-glace défectueux ?', rSR: 'Une mauvaise visibilité en cas d\'intempéries.', qPS: 'Quels sont les numéros d\'urgence à composer ?', rPS: 'Le 18, numéro d\'appel des sapeurs-pompiers. Le 15, numéro d\'appel des SAMU. Le 112, numéro de téléphone réservé aux appels d\'urgence et valide dans l\'ensemble de l\'Union européenne.' },
      { id: 11, verif: 'VI', qSR: 'Quelles sont les précautions à prendre lors du remplissage du réservoir de carburant ?', rSR: 'Arrêter le moteur, ne pas fumer, ne pas téléphoner.', qPS: 'Quels comportements adopter en présence d\'une victime qui ne répond pas et ne réagit pas, mais respire ?', rPS: 'La placer en position stable sur le côté ou position latérale de sécurité. Alerter les secours. Surveiller la respiration de la victime jusqu\'à l\'arrivée des secours.' },
      { id: 12, verif: 'VE', qSR: 'Quel est le danger si l\'on complète le niveau du liquide de refroidissement lorsque le moteur est chaud ?', rSR: 'Un risque de brûlure.', qPS: 'Comment arrêter une hémorragie ?', rPS: 'En appuyant fortement sur l\'endroit qui saigne avec les doigts ou avec la paume de la main en mettant un tissu propre sur la plaie.' },
      { id: 13, verif: 'VI', qSR: 'Quelle peut être la conséquence d\'une panne de dégivrage de la lunette arrière ?', rSR: 'Une insuffisance ou une absence de visibilité vers l\'arrière.', qPS: 'Hors autoroute ou endroit dangereux, en cas de panne ou d\'accident, où doit être placé le triangle de pré-signalisation ?', rPS: 'Le triangle de pré-signalisation doit être placé à une distance d\'environ 30 m de la panne ou de l\'accident, ou avant un virage, ou un sommet de côte.' },
      { id: 14, verif: 'VE', qSR: 'Quelle est la signification d\'un clignotement plus rapide ?', rSR: 'Non-fonctionnement de l\'une des ampoules.', qPS: 'Quelles sont les conditions pour réaliser le dégagement d\'urgence d\'une victime en présence d\'un danger réel, immédiat et non contrôlable ?', rPS: 'La victime doit être visible, facile à atteindre et rien ne doit gêner son dégagement. Il faut être sûr(e) de pouvoir réaliser le dégagement de la victime.' },
      { id: 15, verif: 'VI', qSR: 'Quelles sont les conditions à respecter pour contrôler le niveau d\'huile ?', rSR: 'Moteur froid et sur un terrain plat.', qPS: 'Quelles sont les trois informations à transmettre aux services de secours ?', rPS: 'Le numéro de téléphone à partir duquel l\'appel est émis, la nature et la localisation la plus précise du problème.' },
      { id: 16, verif: 'VE', qSR: 'Dans quels cas utilise-t-on les feux de brouillard arrière ?', rSR: 'Par temps de brouillard et neige.', qPS: 'Par quels moyens doit être réalisée l\'alerte des secours ?', rPS: 'L\'alerte doit être donnée à l\'aide d\'un téléphone portable ou, à défaut, d\'un téléphone fixe ou d\'une borne d\'appel d\'urgence.' },
      { id: 17, verif: 'VI', qSR: 'À partir de quel taux d\'alcoolémie, en période de permis probatoire, est-on en infraction ?', rSR: '0,2 g/l, c\'est-à-dire 0 verre, car dès le 1er verre ce seuil peut être dépassé.', qPS: 'Quel comportement doit-on adopter en présence d\'une victime en arrêt cardiaque ?', rPS: 'ALERTER : alerter immédiatement les secours. MASSER : pratiquer une réanimation cardio-pulmonaire. DEFIBRILLER: utiliser un défibrillateur automatique (DAE) si possible.' },
      { id: 18, verif: 'VE', qSR: 'Dans quels cas doit-on utiliser les feux de détresse ?', rSR: 'En cas de panne, d\'accident ou de ralentissement important.', qPS: 'Dans quel cas peut-on positionner une victime en Position Latérale de Sécurité (PLS) ?', rPS: 'Si la victime ne répond pas, ne réagit pas et respire.' },
      { id: 19, verif: 'VI', qSR: 'Pourquoi est-il important de bien régler son volant ? Citez deux exemples', rSR: 'Le confort de conduite. L\'accessibilité aux commandes. La visibilité du tableau de bord. L\'efficacité des airbags.', qPS: 'Dans quelle situation peut-on déplacer une victime ?', rPS: 'En présence d\'un danger réel, immédiat, non contrôlable. Le déplacement de la victime doit rester exceptionnel.' },
      { id: 20, verif: 'VE', qSR: 'Citez un cas d\'utilisation de l\'appel lumineux', rSR: 'Pour avertir de son approche. En cas de danger. À la place de l\'avertisseur sonore.', qPS: 'En cas de panne ou d\'accident, quel équipement de sécurité doit être porté avant de quitter le véhicule ?', rPS: 'Il faut porter le gilet de haute visibilité avant de sortir du véhicule.' },
      { id: 21, verif: 'VI', qSR: 'Citez deux éléments complémentaires permettant un désembuage efficace', rSR: 'La commande de vitesse de ventilation. La commande d\'air chaud. La climatisation.', qPS: 'Quel est l\'objectif du Signal d\'Alerte et d\'Information des Populations (SAIP) ?', rPS: 'Avertir la population d\'un danger imminent ou qu\'un événement grave est en train de se produire.' },
      { id: 22, verif: 'VE', qSR: 'Quel est le principal risque d\'un manque d\'huile moteur ?', rSR: 'Un risque de détérioration ou de casse du moteur.', qPS: 'Comment est diffusée l\'alerte émise par le Signal d\'Alerte et d\'Information aux Populations (SAIP) ?', rPS: 'Grâce aux sirènes, aux médias tels que Radio France et France Télévision ou encore grâce à l\'application SAIP.' },
      { id: 23, verif: 'VI', qSR: 'Qu\'est-ce qui peut provoquer la décharge de la batterie, moteur éteint ?', rSR: 'Les feux ou accessoires électriques en fonctionnement.', qPS: 'À partir de quel âge peut-on suivre une formation aux premiers secours ?', rPS: 'À partir de 10 ans.' },
      { id: 24, verif: 'VE', qSR: 'Quelle est la solution en cas de panne de batterie pour démarrer le véhicule sans le déplacer ?', rSR: 'Brancher une deuxième batterie en parallèle (ou les “+” ensemble et les “—” ensemble) ou la remplacer.', qPS: 'Pourquoi faut-il pratiquer immédiatement une réanimation cardio-pulmonaire sur une victime en arrêt cardiaque ?', rPS: 'Car les lésions du cerveau surviennent dès les premières minutes.' },
      { id: 25, verif: 'VI', qSR: 'Quel est le risque de circuler avec un frein de parking mal desserré ?', rSR: 'Une dégradation du système de freinage.', qPS: 'Hors autoroute ou endroit dangereux, en cas de panne ou d\'accident, où doit être placé le triangle de pré-signalisation ?', rPS: 'Le triangle de pré-signalisation doit être placé à une distance d\'environ 30 m de la panne ou de l\'accident, ou avant un virage, ou un sommet de côte.' },
      { id: 26, verif: 'VE', qSR: 'Quelles sont les conséquences d\'un mauvais réglage des feux de croisement ?', rSR: 'Une mauvaise vision vers l\'avant et un risque d\'éblouissement des autres usagers.', qPS: 'Dans quelle situation peut-on déplacer une victime ?', rPS: 'En présence d\'un danger réel, immédiat, non contrôlable. Le déplacement de la victime doit rester exceptionnel.' },
      { id: 27, verif: 'VI', qSR: 'Quelle est la conséquence d\'une température trop élevée du liquide de refroidissement ?', rSR: 'Une surchauffe ou une casse moteur.', qPS: 'Lors d\'un appel avec les services de secours, pourquoi devez-vous attendre que votre correspondant vous autorise à raccrocher ?', rPS: 'Car il peut nous conseiller ou nous guider dans la réalisation des gestes à faire, ou ne pas faire, jusqu\'à l\'arrivée des secours.' },
      { id: 28, verif: 'VE', qSR: 'Quelle est l\'utilité des dispositifs réfléchissants ?', rSR: 'Rendre visible le véhicule la nuit.', qPS: 'À quel moment pouvez-vous mettre fin à un appel avec les secours ?', rPS: 'Uniquement lorsque notre correspondant nous invite à le faire.' },
      { id: 29, verif: 'VI', qSR: 'Quelle précaution dois-je prendre pour que les enfants installés à l\'arrière ne puissent pas ouvrir leur portière ?', rSR: 'Actionner la sécurité enfant sur les deux portières arrière.', qPS: 'Citez les trois manières d\'évaluer l\'état de conscience d\'une victime', rPS: 'Lui poser des questions simples (“comment ça va ?”, “vous m\'entendez ?”). Lui secouer doucement les épaules. Lui prendre la main en lui demandant d\'exécuter un geste simple (“serrez-moi la main”).' },
      { id: 30, verif: 'VE', qSR: 'Par temps clair, à quelle distance les feux de position doivent-ils être visibles ?', rSR: 'À 150 mètres.', qPS: 'Quels sont les risques pour une personne en perte de connaissance qui est allongée sur le dos ?', rPS: 'L\'arrêt respiratoire et l\'arrêt cardiaque.' },
      { id: 31, verif: 'VI', qSR: 'Quand utilise-t-on les feux de détresse ?', rSR: 'En cas de panne, d\'accident ou de ralentissement important.', qPS: 'Quels comportements adopter en cas de diffusion du signal d\'alerte du Système d\'Alerte et d\'Information des Populations (SAIP) ?', rPS: 'Se mettre en sécurité. S\'informer grâce aux médias et sites internet des autorités dès que leur consultation est possible. Respecter les consignes des autorités.' },
      { id: 32, verif: 'VE', qSR: 'Qu\'est-ce que l\'aquaplanage et quelle peut être sa conséquence ?', rSR: 'La présence d\'un film d\'eau entre le pneumatique et la chaussée pouvant entraîner une perte de contrôle du véhicule.', qPS: 'Si un dégagement d\'urgence de la victime est nécessaire, où doit-elle être déplacée ?', rPS: 'Dans un endroit suffisamment éloigné du danger et de ses conséquences.' },
      { id: 33, verif: 'VI', qSR: 'Sans actionner la commande du régulateur, comment le désactiver rapidement ?', rSR: 'En appuyant sur la pédale de frein ou d\'embrayage.', qPS: 'Sur autoroute, comment indiquer avec précision les lieux de l\'accident depuis un téléphone portable ?', rPS: 'En indiquant le numéro de l\'autoroute, le sens de circulation et le point kilométrique.' },
      { id: 34, verif: 'VE', qSR: 'Quelles sont les précautions à prendre lors du remplissage du réservoir de carburant ?', rSR: 'Arrêter le moteur, ne pas fumer, ne pas téléphoner.', qPS: 'Pourquoi l\'alerte auprès des services de secours doit-elle être rapide et précise ?', rPS: 'Pour permettre aux services de secours d\'apporter les moyens adaptés aux victimes dans le délai le plus court.' },
      { id: 35, verif: 'VI', qSR: 'Dans quel cas peut-on utiliser l\'avertisseur sonore en agglomération ?', rSR: 'En cas de danger immédiat.', qPS: 'Pourquoi ne faut-il pas laisser une personne en perte de connaissance allongée sur le dos ?', rPS: 'Car elle risque un étouffement par des liquides présents dans la gorge et la chute de la langue en arrière.' },
      { id: 36, verif: 'VE', qSR: 'Quel est le risque d\'un manque d\'huile moteur ?', rSR: 'Un risque de détérioration ou de casse du moteur.', qPS: 'L\'utilisation d\'un Défibrillateur Automatisé (DAE) sur une victime qui n\'est pas en arrêt cardiaque présente-t-elle un risque ?', rPS: 'Non, car le défibrillateur se déclenche uniquement quand la victime est en arrêt cardiaque.' },
      { id: 37, verif: 'VI', qSR: 'Dans quelle situation doit-on désactiver l\'airbag passager ?', rSR: 'Lors du transport d\'un enfant à l\'avant dans un siège auto, dos à la route.', qPS: 'Quelles sont les conditions pour réaliser le dégagement d\'urgence d\'une victime en présence d\'un danger réel, immédiat et non contrôlable ?', rPS: 'La victime doit être visible, facile à atteindre et rien ne doit gêner son dégagement. Il faut être sûr(e) de pouvoir réaliser le dégagement de la victime.' },
      { id: 38, verif: 'VE', qSR: 'À quelle fréquence est-il préconisé de vérifier la pression des pneus ?', rSR: 'Chaque mois, pour une utilisation normale de son véhicule, et avant chaque long trajet.', qPS: 'Comment et pourquoi protéger une zone de danger en cas d\'accident de la route ?', rPS: 'En délimitant clairement et largement la zone de danger de façon visible pour protéger les victimes et éviter un sur-accident.' },
      { id: 39, verif: 'VI', qSR: 'En règle générale, à partir de quel âge un enfant peut-il être installé sur le siège passager avant du véhicule ?', rSR: '10 ans.', qPS: 'Comment est composé le signal d\'alerte du Système d\'Alerte et d\'Information des Populations (SAIP) diffusé par les sirènes ?', rPS: 'Il se compose de deux codes distincts : — Le Signal National d\'Alerte (SNA), variation du signal sur trois cycles successifs — Le signal de fin d\'alerte, signal continu.' },
      { id: 40, verif: 'VE', qSR: 'Un défaut d\'éclairage de la plaque d\'immatriculation lors du contrôle technique entraîne-t-il une contre-visite ?', rSR: 'Oui.', qPS: 'Quelles sont les trois informations à transmettre aux services de secours ?', rPS: 'Le numéro de téléphone à partir duquel l\'appel est émis, la nature et la localisation la plus précise du problème.' },
      { id: 41, verif: 'VI', qSR: 'Quels sont les deux autres documents obligatoires à présenter en cas de contrôle par les forces de l\'ordre ? (Autre que l\'attestation d\'assurance du véhicule)', rSR: 'Le certificat d\'immatriculation et le permis de conduire.', qPS: 'Qu\'est-ce qu\'une hémorragie ?', rPS: 'C\'est une perte de sang prolongée qui ne s\'arrête pas. Elle imbibe de sang un mouchoir en quelques secondes.' },
      { id: 42, verif: 'VE', qSR: 'Si la sécurité enfant est enclenchée, est-il possible d\'ouvrir la portière arrière depuis l\'extérieur ?', rSR: 'Oui.', qPS: 'Quels sont les risques pour une personne victime d\'une hémorragie ?', rPS: 'Entraîner pour la victime une détresse circulatoire ou un arrêt cardiaque.' },
      { id: 43, verif: 'VI', qSR: 'Pouvez-vous utiliser les feux de brouillard arrière par forte pluie ?', rSR: 'Non.', qPS: 'Quels sont les signes d\'un arrêt cardiaque ?', rPS: 'La victime ne répond pas, ne réagit pas et ne respire pas ou présente une respiration anormale.' },
      { id: 44, verif: 'VE', qSR: 'Quelles sont les deux utilités des feux de recul ?', rSR: 'Éclairer la zone de recul la nuit. Avertir les autres usagers de la manœuvre.', qPS: 'Qu\'est-ce qu\'un défibrillateur automatisé externe (DAE) ?', rPS: 'C\'est un appareil qui peut permettre de rétablir une activité cardiaque normale à une victime en arrêt cardiaque.' },
      { id: 45, verif: 'VI', qSR: 'Quelle est l\'utilité de l\'appuie-tête ?', rSR: 'Permets de retenir le mouvement de la tête en cas de choc et de limiter les blessures.', qPS: 'Par quels moyens doit être réalisée l\'alerte des secours ?', rPS: 'L\'alerte doit être donnée à l\'aide d\'un téléphone portable ou, à défaut, d\'un téléphone fixe, ou d\'une borne d\'appel d\'urgence.' },
      { id: 46, verif: 'VE', qSR: 'Quelle est la conséquence en cas de panne des feux de stop ?', rSR: 'Un manque d\'information pour les usagers suiveurs et un risque de collision.', qPS: 'Lors d\'un appel avec les services de secours, pourquoi devez-vous attendre que votre correspondant vous autorise à raccrocher ?', rPS: 'Car il peut nous conseiller ou nous guider dans la réalisation des gestes à faire, ou ne pas faire, jusqu\'à l\'arrivée des secours.' },
      { id: 47, verif: 'VI', qSR: 'Quelle est la différence entre un voyant orange et un voyant rouge ?', rSR: 'Rouge : Une anomalie de fonctionnement ou un danger. Orange : un élément important.', qPS: 'Qu\'est-ce qu\'un arrêt cardiaque ?', rPS: 'Le cœur ne fonctionne plus ou fonctionne d\'une façon anarchique.' },
      { id: 48, verif: 'VE', qSR: 'En roulant, quel est le risque d\'une mauvaise fermeture du capot ?', rSR: 'Un risque d\'ouverture du capot pouvant entraîner un accident.', qPS: 'Quel est le risque principal d\'un arrêt cardiaque sans intervention des secours ?', rPS: 'La mort de la victime qui survient en quelques minutes.' },
      { id: 49, verif: 'VI', qSR: 'Quel peut être le risque de maintenir le recyclage de l\'air de manière prolongée ?', rSR: 'Un risque de mauvaise visibilité par l\'apparition de buée sur les surfaces vitrées.', qPS: 'Quels sont les risques pour une personne en perte de connaissance qui est allongée sur le dos ?', rPS: 'L\'arrêt respiratoire et l\'arrêt cardiaque.' },
      { id: 50, verif: 'VE', qSR: 'Quel est le principal risque d\'une absence de liquide lave-glace ?', rSR: 'Une mauvaise visibilité.', qPS: 'Pourquoi faut-il pratiquer immédiatement une réanimation cardio-pulmonaire sur une victime en arrêt cardiaque ?', rPS: 'Car les lésions du cerveau surviennent dès les premières minutes.' },
      { id: 51, verif: 'VI', qSR: 'Quel est le risque de maintenir les feux de route lors d\'un croisement avec d\'autres usagers ?', rSR: 'Un risque d\'éblouissement des autres usagers.', qPS: 'Quel est l\'objectif du Signal d\'Alerte et d\'Information des Populations (SAIP) ?', rPS: 'Avertir la population d\'un danger imminent ou qu\'un événement grave est en train de se produire.' },
      { id: 52, verif: 'VE', qSR: 'Quelle est l\'utilité des feux diurnes ?', rSR: 'Rendre le véhicule plus visible le jour.', qPS: 'À quel moment pouvez-vous mettre fin à un appel avec les secours ?', rPS: 'Uniquement lorsque notre correspondant nous invite à le faire.' },
      { id: 53, verif: 'VI', qSR: 'En cas d\'accident, dans quel délai le constat amiable doit-il être transmis à l\'assureur ?', rSR: '5 jours.', qPS: 'Quel est le risque principal d\'un arrêt cardiaque sans intervention des secours ?', rPS: 'La mort de la victime qui survient en quelques minutes.' },
      { id: 54, verif: 'VE', qSR: 'Utilise-t-on le triangle de pré-signalisation sur autoroute ?', rSR: 'Non.', qPS: 'Quel comportement doit-on adopter en présence d\'une victime en arrêt cardiaque ?', rPS: 'ALERTER : alerter immédiatement les secours. MASSER : pratiquer une réanimation cardio-pulmonaire. DEFIBRILLER : utiliser un défibrillateur automatique (DAE) si possible.' },
      { id: 55, verif: 'VI', qSR: 'Quel est le risque de circuler avec un frein de parking mal desserré ?', rSR: 'Une dégradation du système de freinage.', qPS: 'Comment arrêter une hémorragie ?', rPS: 'En appuyant fortement sur l\'endroit qui saigne avec les doigts ou avec la paume de la main en mettant un tissu propre sur la plaie.' },
      { id: 56, verif: 'VE', qSR: 'Quelles sont les conséquences en cas de panne d\'un feu de croisement ?', rSR: 'Une mauvaise visibilité et le risque d\'être confondu avec un deux roues.', qPS: 'Citez les trois manières d\'évaluer l\'état de conscience d\'une victime ?', rPS: 'Lui poser des questions simples (“comment ça va ?”, “vous m\'entendez ?”). Lui secouer doucement les épaules. Lui prendre la main en lui demandant d\'exécuter un geste simple (“serrez-moi la main”).' },
      { id: 57, verif: 'VI', qSR: 'Quelle est l\'utilité d\'un limiteur de vitesse ?', rSR: 'Ne pas dépasser la vitesse programmée par le conducteur.', qPS: 'Quels sont les numéros d\'urgence à appeler ?', rPS: 'Le 18, numéro d\'appel des sapeurs-pompiers. Le 15, numéro d\'appel des SAMU. Le 112, numéro de téléphone réservé aux appels d\'urgence et valide dans l\'ensemble de l\'Union européenne.' },
      { id: 58, verif: 'VE', qSR: 'Quelles sont les conséquences en cas de panne d\'un feu de position arrière ?', rSR: 'Être mal vu et un risque de collision.', qPS: 'Comment est diffusée l\'alerte émise par le Signal d\'Alerte et d\'Information aux Populations (SAIP) ?', rPS: 'Grâce aux sirènes, aux médias tels que Radio France et France Télévision ou encore grâce à l\'application SAIP.' },
      { id: 59, verif: 'VI', qSR: 'Pour une bonne visibilité vers l\'arrière, en plus de l\'utilisation de l\'essuie-glace, quelle commande pouvez-vous actionner par temps de pluie ?', rSR: 'La commande de désembuage arrière. Le terme dégivrage peut remplacer celui de désembuage.', qPS: 'Quels comportements adopter en présence d\'une victime qui ne répond pas et ne réagit pas, mais respire ?', rPS: 'La placer en position stable sur le côté ou position latérale de sécurité. Alerter les secours. Surveiller la respiration de la victime jusqu\'à l\'arrivée des secours.' },

    // ================================================================
    // 6. LOGIQUE D'AFFICHAGE
    // ================================================================
    const contentArea = document.getElementById('contentArea');
    const searchInput = document.getElementById('searchInput');
    const tabBtns = document.querySelectorAll('.tab-btn');

    let currentCategory = 'all';
    let currentSearch = '';

    // Variables pour le quiz
    let currentQuestion = null;
    let currentChoices = [];
    let currentCorrectAnswer = '';

    // Fonction pour mélanger un tableau
    function shuffleArray(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    // Fonction pour obtenir une question aléatoire avec 4 choix
    function getRandomQuestion() {
      const randomIndex = Math.floor(Math.random() * questions100.length);
      const question = questions100[randomIndex];
      
      let questionText = '';
      let correctAnswer = '';
      const useSR = Math.random() < 0.5;
      
      if (useSR) {
        questionText = question.qSR;
        correctAnswer = question.rSR;
      } else {
        questionText = question.qPS;
        correctAnswer = question.rPS;
      }
      
      const allAnswers = questions100.map(q => q.rSR);
      const allAnswersPS = questions100.map(q => q.rPS);
      const allPossibleAnswers = [...allAnswers, ...allAnswersPS];
      const uniqueAnswers = [...new Set(allPossibleAnswers.filter(a => a !== correctAnswer))];
      const shuffled = shuffleArray([...uniqueAnswers]);
      const distractors = shuffled.slice(0, 3);
      const choices = [correctAnswer, ...distractors];
      const shuffledChoices = shuffleArray(choices);
      
      return {
        question: questionText,
        correctAnswer: correctAnswer,
        choices: shuffledChoices,
        id: question.id,
        verif: question.verif,
        useSR: useSR
      };
    }

    // Fonction pour afficher la question du quiz
    function displayQuizQuestion() {
      const quizData = getRandomQuestion();
      currentQuestion = quizData;
      currentCorrectAnswer = quizData.correctAnswer;
      currentChoices = quizData.choices;
      
      let html = `

              <i class="fas fa-question-circle"></i> Question ${quizData.id} ${quizData.useSR ? '• Sécurité routière' : '• Premiers secours'}
              <span style="background:#3b7a9e; color:#fff; padding:0.1rem 0.6rem; border-radius:20px; font-size:0.7rem; margin-left:0.5rem;">${quizData.verif}</span>
            </span>
            <button onclick="displayQuizQuestion()" style="background:#1f6d9b; color:#fff; border:none; padding:0.4rem 1.2rem; border-radius:30px; font-weight:600; cursor:pointer; font-family:inherit; transition:0.2s;">
              <i class="fas fa-sync-alt"></i> Nouvelle question
            </button>
          </div>
          
          <div style="font-size:1.2rem; font-weight:600; color:#0b2f49; margin-bottom:1.5rem; padding:0.5rem 0;">
            ${escapeHtml(quizData.question)}
          </div>
          
          <div id="choicesContainer" style="display:flex; flex-direction:column; gap:0.7rem;">
            ${quizData.choices.map((choice, index) => `
              <button onclick="selectChoice(${index})" class="choice-btn" data-index="${index}" style="
                background:#f0f6fd; 
                border:2px solid #d6e2ef; 
                border-radius:12px; 
                padding:0.8rem 1.2rem; 
                text-align:left; 
                font-size:1rem; 
                font-family:inherit; 
                cursor:pointer; 
                transition:0.2s;
                display:flex;
                align-items:center;
                gap:0.8rem;
                color:#1e293b;
                width:100%;
              ">
                <span style="background:#dde9f5; border-radius:50%; width:28px; height:28px; display:flex; align-items:center; justify-content:center; font-weight:700; font-size:0.85rem; color:#1f6d9b; flex-shrink:0;">${String.fromCharCode(65 + index)}</span>
                <span>${escapeHtml(choice)}</span>
              </button>
            `).join('')}
          </div>
          
          <div id="feedbackContainer" style="margin-top:1.2rem; padding:1rem; border-radius:12px; display:none; font-weight:500;">
          </div>
          
          <div style="margin-top:1rem; display:flex; gap:0.8rem; justify-content:center; flex-wrap:wrap;">
            <button onclick="showAnswer()" style="background:#e67e22; color:#fff; border:none; padding:0.5rem 1.5rem; border-radius:30px; font-weight:600; cursor:pointer; font-family:inherit; transition:0.2s;">

    // Fonction pour sélectionner un choix
    function selectChoice(index) {
      const buttons = document.querySelectorAll('.choice-btn');
      const feedback = document.getElementById('feedbackContainer');
      
      if (!buttons.length || !feedback) return;
      
      buttons.forEach(btn => btn.disabled = true);
      
      const selectedText = currentChoices[index];
      const isCorrect = selectedText === currentCorrectAnswer;
      
      buttons.forEach((btn, i) => {
        const choiceText = currentChoices[i];
        if (choiceText === currentCorrectAnswer) {
          btn.style.background = '#27ae60';
          btn.style.borderColor = '#27ae60';
          btn.style.color = '#fff';
          const span = btn.querySelector('span:first-child');
          if (span) { span.style.background = '#fff'; span.style.color = '#27ae60'; }
        } else if (i === index && !isCorrect) {
          btn.style.background = '#e74c3c';
          btn.style.borderColor = '#e74c3c';
          btn.style.color = '#fff';
          const span = btn.querySelector('span:first-child');
          if (span) { span.style.background = '#fff'; span.style.color = '#e74c3c'; }
        } else {
          btn.style.opacity = '0.6';
        }
      });
      
      feedback.style.display = 'block';
      if (isCorrect) {
        feedback.style.background = '#d4edda';
        feedback.style.color = '#155724';
        feedback.style.border = '1px solid #c3e6cb';
        feedback.innerHTML = `<i class="fas fa-check-circle" style="color:#27ae60;"></i> ✅ Bravo ! C'est la bonne réponse.`;
      } else {
        feedback.style.background = '#f8d7da';
        feedback.style.color = '#721c24';
        feedback.style.border = '1px solid #f5c6cb';
        feedback.innerHTML = `<i class="fas fa-times-circle" style="color:#e74c3c;"></i> ❌ Ce n'est pas la bonne réponse. La bonne réponse était : <strong>"${escapeHtml(currentCorrectAnswer)}"</strong>`;
      }
    }

    // Fonction pour afficher la réponse sans sélection
    function showAnswer() {
      const buttons = document.querySelectorAll('.choice-btn');
      const feedback = document.getElementById('feedbackContainer');
      
      if (!buttons.length || !feedback) return;
      
      buttons.forEach(btn => btn.disabled = true);
      
      buttons.forEach((btn, i) => {
        const choiceText = currentChoices[i];
        if (choiceText === currentCorrectAnswer) {
          btn.style.background = '#27ae60';
          btn.style.borderColor = '#27ae60';
          btn.style.color = '#fff';
          const span = btn.querySelector('span:first-child');
          if (span) { span.style.background = '#fff'; span.style.color = '#27ae60'; }
        } else {
          btn.style.opacity = '0.6';
        }
      });
      
      feedback.style.display = 'block';
      feedback.style.background = '#d4edda';
      feedback.style.color = '#155724';
      feedback.style.border = '1px solid #c3e6cb';
      feedback.innerHTML = `<i class="fas fa-info-circle" style="color:#27ae60;"></i> ℹ️ La bonne réponse est : <strong>"${escapeHtml(currentCorrectAnswer)}"</strong>`;
    }

    // Fonction d'affichage principale
    function render() {
      const searchTerm = currentSearch.toLowerCase().trim();

      // Quiz
      if (currentCategory === 'quiz') {
        displayQuizQuestion();
        return;
      }

      // Onglet "verifications-interieures"
      if (currentCategory === 'verifications-interieures') {
        let filtered = verificationsInterieures;
        if (searchTerm) {
          filtered = filtered.filter(item =>
            item.q.toLowerCase().includes(searchTerm) ||
            item.r.toLowerCase().includes(searchTerm) ||
            item.id.toLowerCase().includes(searchTerm)
          );
        }
        if (filtered.length === 0) {
          contentArea.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>Aucune vérification intérieure ne correspond.</p></div>`;
          return;
        }
        let html = `<div class="question-list">`;
        filtered.forEach(item => {
          html += `
            <div class="question-item">
              <span class="q-number">${item.id}</span>
              <div class="q-text">
                <div class="question">${escapeHtml(item.q)}</div>
                <div class="answer"><i class="fas fa-check-circle"></i> ${escapeHtml(item.r)}</div>
              </div>
              <span class="q-category-badge" style="background:#2c7a5a;">VI</span>
            </div>
          `;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
        return;
      }

      // Onglet "verifications-exterieures"
      if (currentCategory === 'verifications-exterieures') {
        let filtered = verificationsExterieures;
        if (searchTerm) {
          filtered = filtered.filter(item =>
            item.q.toLowerCase().includes(searchTerm) ||
            item.r.toLowerCase().includes(searchTerm) ||
            item.id.toLowerCase().includes(searchTerm)
          );
        }
        if (filtered.length === 0) {
          contentArea.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>Aucune vérification extérieure ne correspond.</p></div>`;
          return;
        }
        let html = `<div class="question-list">`;
        filtered.forEach(item => {
          html += `
            <div class="question-item">
              <span class="q-number">${item.id}</span>
              <div class="q-text">
                <div class="question">${escapeHtml(item.q)}</div>
                <div class="answer"><i class="fas fa-check-circle"></i> ${escapeHtml(item.r)}</div>
              </div>
              <span class="q-category-badge" style="background:#d4880f;">VE</span>
            </div>
          `;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
        return;
      }

      // Onglet "securite-routiere"
      if (currentCategory === 'securite-routiere') {
        let filtered = securiteRoutiere;
        if (searchTerm) {
          filtered = filtered.filter(item =>
            item.q.toLowerCase().includes(searchTerm) ||
            item.r.toLowerCase().includes(searchTerm) ||
            item.id.toLowerCase().includes(searchTerm)
          );
        }
        if (filtered.length === 0) {
          contentArea.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>Aucune question de sécurité routière ne correspond.</p></div>`;
          return;
        }
        let html = `<div class="question-list">`;
        filtered.forEach(item => {
          html += `
            <div class="question-item">
              <span class="q-number">${item.id}</span>
              <div class="q-text">
                <div class="question">${escapeHtml(item.q)}</div>
                <div class="answer"><i class="fas fa-check-circle"></i> ${escapeHtml(item.r)}</div>
              </div>
              <span class="q-category-badge" style="background:#1f6d9b;">SR</span>
            </div>
          `;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
        return;
      }

      // Onglet "premiers-secours"
      if (currentCategory === 'premiers-secours') {
        let filtered = premiersSecours;
        if (searchTerm) {
          filtered = filtered.filter(item =>
            item.q.toLowerCase().includes(searchTerm) ||
            item.r.toLowerCase().includes(searchTerm)
          );
        }
        if (filtered.length === 0) {
          contentArea.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>Aucune question de premiers secours ne correspond.</p></div>`;
          return;
        }
        let html = `<div class="question-list">`;
        filtered.forEach((item, index) => {
          html += `
            <div class="question-item">
              <span class="q-number">${index + 1}</span>
              <div class="q-text">
                <div class="question">${escapeHtml(item.q)}</div>
                <div class="answer"><i class="fas fa-check-circle"></i> ${escapeHtml(item.r)}</div>
              </div>
              <span class="q-category-badge" style="background:#b33c5a;">PS</span>
            </div>
          `;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
        return;
      }

      // Onglet "questions-1-100"
      if (currentCategory === 'questions-1-100') {
        let filtered = questions100;
        if (searchTerm) {
          filtered = filtered.filter(item =>
            item.qSR.toLowerCase().includes(searchTerm) ||
            item.rSR.toLowerCase().includes(searchTerm) ||
            item.qPS.toLowerCase().includes(searchTerm) ||
            item.rPS.toLowerCase().includes(searchTerm) ||
            item.verif.toLowerCase().includes(searchTerm)
          );
        }
        if (filtered.length === 0) {
          contentArea.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>Aucune question 1-100 ne correspond.</p></div>`;
          return;
        }
        let html = `<div class="q-100-list">`;
        filtered.forEach(item => {
          let doublonInfo = '';
          const viItem = verificationsInterieures.find(vi => {
            const ids = vi.id.split(' / ').map(s => s.trim());
            return ids.includes(String(item.id));
          });
          if (viItem && viItem.id.includes(' / ')) {
            doublonInfo = `Doublons : ${viItem.id}`;
          }
          if (!doublonInfo) {
            const veItem = verificationsExterieures.find(ve => {
              const ids = ve.id.split(' / ').map(s => s.trim());
              return ids.includes(String(item.id));
            });
            if (veItem && veItem.id.includes(' / ')) {
              doublonInfo = `Doublons : ${veItem.id}`;
            }
          }
          if (!doublonInfo) {
            const srItem = securiteRoutiere.find(sr => {
              const ids = sr.id.split(' / ').map(s => s.trim());
              return ids.includes(String(item.id));
            });
            if (srItem && srItem.id.includes(' / ')) {
              doublonInfo = `Doublons : ${srItem.id}`;
            }
          }
          html += `
            <div class="q-100-item">
              <div class="q-100-header">
                <span class="num">${item.id}</span>
                <span class="verif-badge">${item.verif}</span>
                ${doublonInfo ? `<span class="doublon-info">${doublonInfo}</span>` : ''}
              </div>
              <div class="q-100-body">
                <div class="sub-q">
                  <span class="label"><i class="fas fa-car" style="color:#1f6d9b;"></i> Sécurité routière :</span>
                  <span class="text">${escapeHtml(item.qSR)}</span>
                  <div class="reponse"><i class="fas fa-check-circle"></i> ${escapeHtml(item.rSR)}</div>
                </div>
                <div class="sub-q">
                  <span class="label"><i class="fas fa-heartbeat" style="color:#b33c5a;"></i> Premiers secours :</span>
                  <span class="text">${escapeHtml(item.qPS)}</span>
                  <div class="reponse"><i class="fas fa-check-circle"></i> ${escapeHtml(item.rPS)}</div>
                </div>
              </div>
            </div>
          `;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
        return;
      }

      // Onglet "all" (Toutes)
      let allQuestions = [];
      securiteRoutiere.forEach(item => {
        allQuestions.push({ id: item.id, cat: 'securite-routiere', q: item.q, r: item.r });
      });
      verificationsInterieures.forEach(item => {
        allQuestions.push({ id: item.id, cat: 'verifications-interieures', q: item.q, r: item.r });
      });
      verificationsExterieures.forEach(item => {
        allQuestions.push({ id: item.id, cat: 'verifications-exterieures', q: item.q, r: item.r });
      });
      premiersSecours.forEach((item, index) => {
        allQuestions.push({ id: `PS-${index + 1}`, cat: 'premiers-secours', q: item.q, r: item.r });
      });

      let filtered = allQuestions;
      if (searchTerm) {
        filtered = filtered.filter(item =>
          item.q.toLowerCase().includes(searchTerm) ||
          item.r.toLowerCase().includes(searchTerm) ||
          item.id.toLowerCase().includes(searchTerm)
        );
      }
      if (filtered.length === 0) {
        contentArea.innerHTML = `<div class="empty-state"><i class="fas fa-search"></i><p>Aucune question ne correspond.</p></div>`;
        return;
      }

      let html = `<div class="question-list">`;
      filtered.forEach(item => {
        let catLabel = '';
        let catColor = '';
        switch (item.cat) {
          case 'securite-routiere': catLabel = 'SR'; catColor = '#1f6d9b'; break;
          case 'premiers-secours': catLabel = 'PS'; catColor = '#b33c5a'; break;
          case 'verifications-interieures': catLabel = 'VI'; catColor = '#2c7a5a'; break;
          case 'verifications-exterieures': catLabel = 'VE'; catColor = '#d4880f'; break;
          default: catLabel = ''; catColor = '#3b7a9e';
        }
        html += `
          <div class="question-item">
            <span class="q-number">${item.id}</span>
            <div class="q-text">
              <div class="question">${escapeHtml(item.q)}</div>
              <div class="answer"><i class="fas fa-check-circle"></i> ${escapeHtml(item.r)}</div>
            </div>
            <span class="q-category-badge" style="background:${catColor};">${catLabel}</span>
          </div>
        `;
      });
      html += `</div>`;
      contentArea.innerHTML = html;
    }

    function setCategory(cat) {
      currentCategory = cat;
      tabBtns.forEach(btn => {
        btn.classList.toggle('active', btn.dataset.cat === cat);
      });
      render();
    }

    // Événements
    tabBtns.forEach(btn => {
      btn.addEventListener('click', function() {
        setCategory(this.dataset.cat);
      });
    });

    searchInput.addEventListener('input', function() {
      currentSearch = this.value;
      render();
    });

    // Ajout du bouton Quiz
    const tabNav = document.getElementById('tabNav');
    const quizBtn = document.createElement('button');
    quizBtn.className = 'tab-btn';
    quizBtn.dataset.cat = 'quiz';
    quizBtn.innerHTML = '<i class="fas fa-brain"></i> Quiz (1-100)';
    quizBtn.addEventListener('click', function() {
      setCategory('quiz');
    });
    tabNav.appendChild(quizBtn);

    // Initialisation
    setCategory('all');
  </script>
