<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
               initial-scale=1.0,
               maximum-scale=1.0,
               user-scalable=no">

<meta name="theme-color" content="#05070a">

<meta name="description"
      content="Digital Hub Ingénierie & Travaux : jeux, outils, génie civil, mathématiques, programmation, IA, connaissances et multimédia.">

<title>Digital Hub · Ingénierie & Travaux</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

html,
body{
  width:100%;
  height:100%;
}

button,
input{
  font:inherit;
}


/* =========================================================
   VARIABLES
========================================================= */

:root{

  --bg:
    radial-gradient(circle at 10% 10%,#063c35 0%,transparent 32%),
    radial-gradient(circle at 90% 90%,#082746 0%,transparent 32%),
    #05070a;

  --panel:rgba(7,12,17,.72);

  --card:rgba(255,255,255,.055);

  --card-hover:rgba(255,255,255,.10);

  --text:#fff;

  --muted:rgba(255,255,255,.55);

  --border:rgba(255,255,255,.12);

  --border-hover:rgba(0,255,204,.45);

  --glow:#00ffcc;

  --glow2:#00aaff;

  --gold:#ffd43b;

  --danger:#ff5577;

  --radius:18px;

  --shadow:
    0 0 25px rgba(0,255,204,.18);

}


body.light{

  --bg:
    radial-gradient(circle at 10% 10%,#d8fff5 0%,transparent 32%),
    radial-gradient(circle at 90% 90%,#dcecff 0%,transparent 32%),
    #eef3ff;

  --panel:rgba(255,255,255,.72);

  --card:rgba(255,255,255,.65);

  --card-hover:rgba(255,255,255,.95);

  --text:#111827;

  --muted:rgba(17,24,39,.55);

  --border:rgba(0,0,0,.10);

  --border-hover:rgba(0,119,255,.45);

  --glow:#0077ff;

  --glow2:#00aaff;

  --shadow:
    0 0 25px rgba(0,119,255,.18);

}


body.neon{

  --bg:
    radial-gradient(circle at 10% 10%,#450052 0%,transparent 35%),
    radial-gradient(circle at 90% 90%,#001b45 0%,transparent 35%),
    #000;

  --panel:rgba(0,0,0,.78);

  --card:rgba(255,255,255,.035);

  --card-hover:rgba(255,0,255,.12);

  --text:#fff;

  --muted:rgba(255,255,255,.55);

  --border:rgba(255,0,255,.28);

  --border-hover:rgba(255,0,255,.8);

  --glow:#ff00ff;

  --glow2:#00ffff;

  --shadow:
    0 0 30px rgba(255,0,255,.25);

}


/* =========================================================
   BODY
========================================================= */

body{

  font-family:
    Inter,
    "Segoe UI",
    system-ui,
    sans-serif;

  color:var(--text);

  background:var(--bg);

  overflow:hidden;

  display:flex;

  align-items:center;

  justify-content:center;

  transition:
    background .4s ease,
    color .3s ease;

}


/* =========================================================
   BACKGROUND
========================================================= */

.background{

  position:fixed;

  inset:0;

  overflow:hidden;

  pointer-events:none;

  z-index:0;

}

.orb{

  position:absolute;

  width:380px;

  height:380px;

  border-radius:50%;

  filter:blur(90px);

  opacity:.15;

  animation:
    floatOrb 18s ease-in-out infinite alternate;

}

.orb.one{

  background:#00ffcc;

  left:-130px;

  top:-120px;

}

.orb.two{

  background:#0066ff;

  right:-130px;

  bottom:-130px;

  animation-delay:-7s;

}

.orb.three{

  background:#ff00ff;

  width:250px;

  height:250px;

  left:45%;

  top:40%;

  animation-delay:-12s;

}

@keyframes floatOrb{

  from{
    transform:
      translate3d(0,0,0)
      scale(1);
  }

  to{
    transform:
      translate3d(70px,50px,0)
      scale(1.15);
  }

}


/* =========================================================
   PARTICLES
========================================================= */

#particles{

  position:fixed;

  inset:0;

  width:100%;

  height:100%;

  pointer-events:none;

  z-index:1;

  opacity:.65;

}


/* =========================================================
   APPLICATION
========================================================= */

.app{

  position:relative;

  z-index:5;

  width:min(760px,96vw);

  height:min(900px,96vh);

  display:flex;

  flex-direction:column;

  padding:20px;

  border:1px solid var(--border);

  border-radius:28px;

  background:var(--panel);

  backdrop-filter:blur(28px);

  -webkit-backdrop-filter:blur(28px);

  box-shadow:
    0 25px 100px rgba(0,0,0,.42),
    var(--shadow);

  overflow:hidden;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:12px;

  margin-bottom:15px;

}

.brand{

  min-width:0;

}

.brand-title{

  font-size:1.08rem;

  font-weight:800;

  letter-spacing:2px;

  text-transform:uppercase;

  display:flex;

  align-items:center;

  gap:8px;

}

.brand-sub{

  margin-top:4px;

  font-size:.64rem;

  color:var(--muted);

  letter-spacing:1.5px;

}

.top-actions{

  display:flex;

  gap:7px;

}


/* =========================================================
   ICON BUTTON
========================================================= */

.icon-btn{

  width:42px;

  height:42px;

  flex-shrink:0;

  border:1px solid var(--border);

  border-radius:50%;

  background:var(--card);

  color:var(--text);

  cursor:pointer;

  display:flex;

  align-items:center;

  justify-content:center;

  font-size:1rem;

  transition:
    transform .18s ease,
    border-color .18s ease,
    background .18s ease;

  -webkit-tap-highlight-color:transparent;

}

.icon-btn:hover{

  transform:translateY(-2px) scale(1.05);

  border-color:var(--glow);

  background:var(--card-hover);

}

.icon-btn:active{

  transform:scale(.94);

}


/* =========================================================
   HERO
========================================================= */

.hero{

  padding:14px;

  margin-bottom:13px;

  border:1px solid var(--border);

  border-radius:18px;

  background:
    linear-gradient(
      135deg,
      rgba(0,255,204,.07),
      rgba(0,170,255,.04),
      transparent
    );

  position:relative;

  overflow:hidden;

}

.hero::after{

  content:"";

  position:absolute;

  width:130px;

  height:130px;

  border-radius:50%;

  right:-50px;

  top:-50px;

  background:var(--glow);

  filter:blur(60px);

  opacity:.12;

}

.hero-top{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

}

.hero-title{

  font-size:.95rem;

  font-weight:700;

}

.hero-description{

  margin-top:4px;

  font-size:.67rem;

  color:var(--muted);

  line-height:1.5;

}

.status{

  flex-shrink:0;

  display:flex;

  align-items:center;

  gap:5px;

  padding:5px 8px;

  border:1px solid var(--border);

  border-radius:999px;

  font-size:.57rem;

  color:var(--muted);

}

.status-dot{

  width:6px;

  height:6px;

  border-radius:50%;

  background:var(--glow);

  box-shadow:0 0 10px var(--glow);

}


/* =========================================================
   SEARCH
========================================================= */

.search{

  position:relative;

  margin-bottom:11px;

}

.search input{

  width:100%;

  height:48px;

  border:1px solid var(--border);

  border-radius:15px;

  outline:none;

  background:var(--card);

  color:var(--text);

  padding:0 72px 0 45px;

  font-size:.88rem;

  transition:
    border-color .2s,
    box-shadow .2s,
    background .2s;

}

.search input::placeholder{

  color:var(--muted);

}

.search input:focus{

  border-color:var(--glow);

  background:var(--card-hover);

  box-shadow:
    0 0 20px rgba(0,255,204,.10);

}

.search-icon{

  position:absolute;

  left:15px;

  top:50%;

  transform:translateY(-50%);

  opacity:.55;

  pointer-events:none;

}

.clear-search{

  position:absolute;

  right:12px;

  top:50%;

  transform:translateY(-50%);

  border:none;

  background:none;

  color:var(--muted);

  cursor:pointer;

  display:none;

  font-size:.95rem;

  padding:6px;

}


/* =========================================================
   STATS
========================================================= */

.stats{

  display:grid;

  grid-template-columns:
    repeat(4,1fr);

  gap:7px;

  margin-bottom:11px;

}

.stat{

  min-width:0;

  padding:9px 7px;

  border:1px solid var(--border);

  border-radius:13px;

  background:var(--card);

  text-align:center;

  transition:
    border-color .2s,
    transform .2s;

}

.stat:hover{

  transform:translateY(-2px);

  border-color:var(--border-hover);

}

.stat strong{

  display:block;

  font-size:.88rem;

}

.stat span{

  display:block;

  margin-top:2px;

  font-size:.53rem;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.8px;

}


/* =========================================================
   CATEGORIES
========================================================= */

.categories{

  display:flex;

  gap:7px;

  overflow-x:auto;

  scrollbar-width:none;

  margin-bottom:11px;

  padding:2px 1px 4px;

}

.categories::-webkit-scrollbar{

  display:none;

}

.category{

  flex-shrink:0;

  border:1px solid var(--border);

  background:var(--card);

  color:var(--text);

  padding:8px 11px;

  border-radius:999px;

  cursor:pointer;

  font-size:.65rem;

  white-space:nowrap;

  transition:
    .18s ease;

}

.category:hover{

  transform:translateY(-1px);

  border-color:var(--border-hover);

}

.category.active{

  border-color:var(--glow);

  background:var(--card-hover);

  box-shadow:
    0 0 14px rgba(0,255,204,.10);

}


/* =========================================================
   CONTENT HEADER
========================================================= */

.content-header{

  display:flex;

  align-items:center;

  justify-content:space-between;

  gap:10px;

  margin:3px 2px 8px;

}

.section-title{

  font-size:.67rem;

  text-transform:uppercase;

  letter-spacing:1.5px;

  color:var(--muted);

}

.sort-select{

  border:1px solid var(--border);

  border-radius:8px;

  background:var(--card);

  color:var(--text);

  padding:5px 7px;

  outline:none;

  font-size:.58rem;

}


/* =========================================================
   CONTENT
========================================================= */

.content{

  flex:1;

  min-height:0;

  overflow-y:auto;

  padding-right:4px;

  scrollbar-width:thin;

  scrollbar-color:
    var(--glow)
    transparent;

  -webkit-overflow-scrolling:touch;

  overscroll-behavior:contain;

}

.content::-webkit-scrollbar{

  width:5px;

}

.content::-webkit-scrollbar-thumb{

  background:var(--glow);

  border-radius:10px;

}


/* =========================================================
   ITEM
========================================================= */

.item{

  position:relative;

  width:100%;

  min-height:64px;

  margin-bottom:7px;

  padding:10px 11px;

  border:1px solid var(--border);

  border-radius:17px;

  background:var(--card);

  color:var(--text);

  display:flex;

  align-items:center;

  gap:10px;

  cursor:pointer;

  user-select:none;

  outline:none;

  transition:
    transform .16s ease,
    border-color .16s ease,
    background .16s ease,
    box-shadow .16s ease;

  -webkit-tap-highlight-color:transparent;

}

.item:hover{

  background:var(--card-hover);

  border-color:var(--border-hover);

  transform:translateX(3px);

}

.item.selected{

  border-color:var(--glow);

  box-shadow:
    0 0 18px rgba(0,255,204,.10);

  background:var(--card-hover);

  transform:translateX(4px);

}

.item:focus-visible{

  outline:2px solid var(--glow);

  outline-offset:2px;

}

.item-icon{

  width:40px;

  height:40px;

  flex-shrink:0;

  display:flex;

  align-items:center;

  justify-content:center;

  border-radius:12px;

  background:rgba(255,255,255,.055);

  font-size:1.15rem;

}

.item-main{

  flex:1;

  min-width:0;

}

.item-name-row{

  display:flex;

  align-items:center;

  gap:7px;

  min-width:0;

}

.item-name{

  font-size:.82rem;

  font-weight:600;

  line-height:1.25;

  overflow:hidden;

  text-overflow:ellipsis;

  white-space:nowrap;

}

.item-category{

  margin-top:3px;

  font-size:.57rem;

  color:var(--muted);

  text-transform:uppercase;

  letter-spacing:.75px;

}

.item-actions{

  display:flex;

  align-items:center;

  gap:5px;

  flex-shrink:0;

}

.favorite{

  width:32px;

  height:32px;

  border:none;

  background:transparent;

  color:var(--muted);

  cursor:pointer;

  border-radius:50%;

  font-size:1rem;

  display:flex;

  align-items:center;

  justify-content:center;

}

.favorite:hover,
.favorite.active{

  color:var(--gold);

  background:rgba(255,212,59,.10);

}

.launch{

  width:28px;

  height:28px;

  display:flex;

  align-items:center;

  justify-content:center;

  color:var(--muted);

  font-size:.65rem;

}

.badge{

  flex-shrink:0;

  padding:3px 6px;

  border-radius:999px;

  font-size:.47rem;

  font-weight:700;

  text-transform:uppercase;

  letter-spacing:.5px;

  border:1px solid var(--border);

  color:var(--muted);

}

.badge.hot{

  color:#ff9d3b;

  border-color:rgba(255,157,59,.35);

  background:rgba(255,157,59,.08);

}

.badge.ai{

  color:#b86cff;

  border-color:rgba(184,108,255,.35);

  background:rgba(184,108,255,.08);

}

.badge.new{

  color:var(--glow);

  border-color:var(--border-hover);

}


/* =========================================================
   EMPTY
========================================================= */

.empty{

  text-align:center;

  padding:55px 20px;

  color:var(--muted);

}

.empty-icon{

  font-size:2.5rem;

  margin-bottom:10px;

}

.empty strong{

  display:block;

  color:var(--text);

  margin-bottom:5px;

}


/* =========================================================
   FOOTER
========================================================= */

.footer{

  display:flex;

  align-items:center;

  justify-content:center;

  flex-wrap:wrap;

  gap:5px;

  padding-top:10px;

  text-align:center;

  font-size:.58rem;

  color:var(--muted);

  letter-spacing:.6px;

}

.footer kbd{

  border:1px solid var(--border);

  padding:2px 5px;

  border-radius:5px;

  background:var(--card);

  color:var(--text);

}


/* =========================================================
   TOAST
========================================================= */

#toast{

  position:fixed;

  left:50%;

  bottom:24px;

  transform:
    translate(-50%,80px);

  opacity:0;

  z-index:100;

  padding:11px 19px;

  border:1px solid var(--glow);

  border-radius:999px;

  background:rgba(0,0,0,.86);

  backdrop-filter:blur(12px);

  color:white;

  font-size:.75rem;

  pointer-events:none;

  transition:.3s ease;

  white-space:nowrap;

}

#toast.show{

  opacity:1;

  transform:
    translate(-50%,0);

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:600px){

  body{

    align-items:stretch;

  }

  .app{

    width:100vw;

    height:100dvh;

    max-height:none;

    border-radius:0;

    border:0;

    padding:13px;

  }

  .brand-title{

    font-size:.88rem;

  }

  .brand-sub{

    font-size:.52rem;

    letter-spacing:1px;

  }

  .hero{

    padding:11px;

  }

  .hero-title{

    font-size:.82rem;

  }

  .hero-description{

    font-size:.6rem;

  }

  .status{

    font-size:.5rem;

  }

  .stats{

    grid-template-columns:
      repeat(4,1fr);

    gap:5px;

  }

  .stat{

    padding:8px 3px;

  }

  .stat strong{

    font-size:.78rem;

  }

  .stat span{

    font-size:.45rem;

  }

  .item{

    min-height:63px;

    padding:9px;

  }

  .item-icon{

    width:37px;

    height:37px;

    font-size:1rem;

  }

  .item-name{

    font-size:.75rem;

  }

  .item-category{

    font-size:.52rem;

  }

  .badge{

    display:none;

  }

  .footer{

    padding-top:8px;

    font-size:.52rem;

  }

}

@media(max-width:380px){

  .app{

    padding:10px;

  }

  .hero{

    display:none;

  }

  .item-category{

    display:none;

  }

  .item-icon{

    width:34px;

    height:34px;

  }

}


/* =========================================================
   REDUCED MOTION
========================================================= */

@media(prefers-reduced-motion:reduce){

  *,
  *::before,
  *::after{

    animation-duration:.01ms!important;

    animation-iteration-count:1!important;

    transition-duration:.01ms!important;

  }

}

</style>

</head>

/* =========================================================
   ELEMENTS
========================================================= */

const content =
document.getElementById("content");

const categories =
document.getElementById("categories");

const search =
document.getElementById("search");

const clearSearch =
document.getElementById("clearSearch");

const totalCount =
document.getElementById("totalCount");

const visibleCount =
document.getElementById("visibleCount");

const favoriteCount =
document.getElementById("favoriteCount");

const historyCount =
document.getElementById("historyCount");

const themeBtn =
document.getElementById("themeBtn");

const homeBtn =
document.getElementById("homeBtn");

const fullscreenBtn =
document.getElementById("fullscreenBtn");

const toast =
document.getElementById("toast");


/* =========================================================
   ETAT
========================================================= */

let currentCategory="Toutes";

let currentIndex=0;

let filteredApps=[...apps];

let sortMode=
localStorage.getItem("digitalHubSort")
||"default";


let favorites=
JSON.parse(
localStorage.getItem("digitalHubFavorites")
||"[]"
);


let history=
JSON.parse(
localStorage.getItem("digitalHubHistory")
||"[]"
);


/* =========================================================
   CATEGORIES
========================================================= */

const categoryIcons={

  "Toutes":"🌐",

  "Favoris":"⭐",

  "Récentes":"🕘",

  "Jeux":"🎮",

  "Génie civil":"🏗️",

  "Outils":"🧮",

  "Mathématiques":"📐",

  "Programmation":"💻",

  "IA & Technologie":"🤖",

  "Connaissances":"🧠",

  "Histoires":"📖",

  "Multimédia":"🎵"

};


function getCategories(){

  return [

    "Toutes",

    "Favoris",

    "Récentes",

    ...new Set(
      apps.map(
        app=>app.category
      )
    )

  ];

}


function renderCategories(){

  categories.innerHTML="";

  getCategories().forEach(
    category=>{

      const button=
      document.createElement("button");

      button.className="category";

      if(
        category===
        currentCategory
      ){

        button.classList.add("active");

      }

      let count="";

      if(category==="Favoris"){

        count=
        favorites.length;

      }

      else if(category==="Récentes"){

        count=
        history.length;

      }

      else if(category!=="Toutes"){

        count=
        apps.filter(
          app=>
          app.category===category
        ).length;

      }

      else{

        count=apps.length;

      }

      button.textContent=
      `${categoryIcons[category]||"📁"} ${category} · ${count}`;

      button.addEventListener(
        "click",
        ()=>{

          currentCategory=
          category;

          currentIndex=0;

          renderCategories();

          renderApps();

        }
      );

      categories.appendChild(button);

    }
  );

}


/* =========================================================
   FAVORIS
========================================================= */

function isFavorite(id){

  return favorites.includes(id);

}


function saveFavorites(){

  localStorage.setItem(
    "digitalHubFavorites",
    JSON.stringify(favorites)
  );

}


function updateFavoriteCount(){

  favoriteCount.textContent=
  favorites.length;

}


function toggleFavorite(id){

  if(isFavorite(id)){

    favorites=
    favorites.filter(
      x=>x!==id
    );

    showToast(
      "☆ Retiré des favoris"
    );

  }

  else{

    favorites.push(id);

    showToast(
      "⭐ Ajouté aux favoris"
    );

  }

  saveFavorites();

  updateFavoriteCount();

  renderCategories();

  renderApps();

}


/* =========================================================
   HISTORIQUE
========================================================= */

function saveHistory(){

  localStorage.setItem(
    "digitalHubHistory",
    JSON.stringify(history)
  );

}


function addToHistory(id){

  history=
  history.filter(
    x=>x!==id
  );

  history.unshift(id);

  history=
  history.slice(0,12);

  saveHistory();

  updateHistoryCount();

}


function updateHistoryCount(){

  historyCount.textContent=
  history.length;

}


/* =========================================================
   FILTRAGE
========================================================= */

function getFilteredApps(){

  const query=
  search.value
  .trim()
  .toLowerCase();


  let result;


  if(
    currentCategory===
    "Favoris"
  ){

    result=
    apps.filter(
      app=>
      isFavorite(app.id)
    );

  }

  else if(
    currentCategory===
    "Récentes"
  ){

    result=
    history
    .map(
      id=>
      apps.find(
        app=>app.id===id
      )
    )
    .filter(Boolean);

  }

  else{

    result=
    apps.filter(
      app=>
      currentCategory==="Toutes"
      ||
      app.category===
      currentCategory
    );

  }


  if(query){

    result=
    result.filter(
      app=>
        app.name
        .toLowerCase()
        .includes(query)

        ||

        app.category
        .toLowerCase()
        .includes(query)

        ||

        String(app.id)
        .includes(query)
    );

  }


  if(sortMode==="name"){

    result.sort(
      (a,b)=>
      a.name.localeCompare(
        b.name,
        "fr"
      )
    );

  }

  else if(sortMode==="category"){

    result.sort(
      (a,b)=>
      a.category.localeCompare(
        b.category,
        "fr"
      )
    );

  }


  return result;

}


/* =========================================================
   BADGE
========================================================= */

function badgeHTML(app){

  if(!app.badge){
    return "";
  }

  const labels={
    hot:"🔥 POPULAIRE",
    ai:"IA",
    new:"NOUVEAU"
  };

  return `
    <span class="badge ${app.badge}">
      ${labels[app.badge]||app.badge}
    </span>
  `;

}


/* =========================================================
   RENDU
========================================================= */

function renderApps(){

  filteredApps=
  getFilteredApps();

  visibleCount.textContent=
  filteredApps.length;

  content.innerHTML="";


  const header=
  document.createElement("div");

  header.className=
  "content-header";


  const title=
  document.createElement("div");

  title.className=
  "section-title";


  const titleMap={

    "Toutes":
    "Toutes les applications",

    "Favoris":
    "Mes favoris",

    "Récentes":
    "Dernières applications"

  };


  title.textContent=
  titleMap[currentCategory]
  ||
  currentCategory;


  const select=
  document.createElement("select");

  select.className=
  "sort-select";

  select.setAttribute(
    "aria-label",
    "Trier"
  );


  select.innerHTML=`

    <option value="default">
      Ordre original
    </option>

    <option value="name">
      Nom A → Z
    </option>

    <option value="category">
      Catégorie
    </option>

  `;


  select.value=
  sortMode;


  select.addEventListener(
    "change",
    ()=>{

      sortMode=
      select.value;

      localStorage.setItem(
        "digitalHubSort",
        sortMode
      );

      currentIndex=0;

      renderApps();

    }
  );


  header.appendChild(title);

  header.appendChild(select);

  content.appendChild(header);


  if(!filteredApps.length){

    content.innerHTML+=`

      <div class="empty">

        <div class="empty-icon">
          ${
            currentCategory==="Favoris"
            ? "⭐"
            :
            currentCategory==="Récentes"
            ? "🕘"
            : "🔎"
          }
        </div>

        <strong>
          ${
            currentCategory==="Favoris"
            ? "Aucun favori"
            :
            currentCategory==="Récentes"
            ? "Aucune application récente"
            :
            "Aucun résultat"
          }
        </strong>

        <span>
          ${
            currentCategory==="Favoris"
            ? "Ajoute tes applications préférées avec ★."
            :
            currentCategory==="Récentes"
            ? "Lance une application pour la retrouver ici."
            :
            "Essaie un autre mot-clé."
          }
        </span>

      </div>

    `;

    return;

  }


  filteredApps.forEach(
    (app,index)=>{

      const item=
      document.createElement("div");

      item.className="item";

      if(index===currentIndex){

        item.classList.add(
          "selected"
        );

      }

      item.tabIndex=0;

      item.setAttribute(
        "role",
        "option"
      );

      item.setAttribute(
        "aria-selected",
        index===currentIndex
        ?"true"
        :"false"
      );


      const favorite=
      isFavorite(app.id);


      item.innerHTML=`

        <div class="item-icon">
          ${app.icon}
        </div>


        <div class="item-main">

          <div class="item-name-row">

            <div class="item-name">
              ${app.id}. ${escapeHTML(app.name)}
            </div>

            ${badgeHTML(app)}

          </div>


          <div class="item-category">

            ${escapeHTML(app.category)}

            ${
              app.disabled
              ? " · bientôt disponible"
              : ""
            }

          </div>

        </div>


        <div class="item-actions">

          <button
            class="favorite ${favorite?"active":""}"
            aria-label="${
              favorite
              ?"Retirer des favoris"
              :"Ajouter aux favoris"
            }"
            title="${
              favorite
              ?"Retirer des favoris"
              :"Ajouter aux favoris"
            }">

            ${favorite?"★":"☆"}

          </button>


          <span class="launch">

            ${app.disabled?"🚧":"▶"}

          </span>

        </div>

      `;


      item.addEventListener(
        "click",
        event=>{

          if(
            event.target.closest(
              ".favorite"
            )
          ){

            return;

          }

          launchApp(app);

        }
      );


      item.addEventListener(
        "focus",
        ()=>{

          currentIndex=
          index;

          updateSelection();

        }
      );


      const fav=
      item.querySelector(
        ".favorite"
      );


      fav.addEventListener(
        "click",
        event=>{

          event.stopPropagation();

          toggleFavorite(
            app.id
          );

        }
      );


      content.appendChild(item);

    }
  );

}


/* =========================================================
   ESCAPE
========================================================= */

function escapeHTML(value){

  return String(value)

  .replace(
    /&/g,
    "&amp;"
  )

  .replace(
    /</g,
    "&lt;"
  )

  .replace(
    />/g,
    "&gt;"
  )

  .replace(
    /"/g,
    "&quot;"
  )

  .replace(
    /'/g,
    "&#039;"
  );

}


/* =========================================================
   SELECTION
========================================================= */

function updateSelection(){

  const items=
  content.querySelectorAll(
    ".item"
  );


  items.forEach(
    (item,index)=>{

      const selected=
      index===currentIndex;

      item.classList.toggle(
        "selected",
        selected
      );

      item.setAttribute(
        "aria-selected",
        selected
        ?"true"
        :"false"
      );

    }
  );


  const current=
  items[currentIndex];


  if(current){

    current.scrollIntoView({
      block:"nearest",
      behavior:"smooth"
    });

  }

}


function moveSelection(direction){

  if(!filteredApps.length){

    return;

  }


  currentIndex=
  (
    currentIndex+
    direction+
    filteredApps.length
  )
  %
  filteredApps.length;


  updateSelection();


  playTone(
    440,
    .035,
    "sine",
    .025
  );

}


/* =========================================================
   LANCEMENT
========================================================= */

function launchApp(app){

  if(!app){
    return;
  }


  if(app.disabled){

    showToast(
      "🚧 Cette application est encore en développement"
    );

    return;

  }


  addToHistory(app.id);

  playTone(
    880,
    .08,
    "triangle",
    .05
  );


  showToast(
    "🚀 Ouverture de "+app.name
  );


  setTimeout(
    ()=>{

      window.location.href=
      app.url;

    },
    120
  );

}


/* =========================================================
   RECHERCHE
========================================================= */

search.addEventListener(
  "input",
  ()=>{

    clearSearch.style.display=
    search.value
    ?"block"
    :"none";

    currentIndex=0;

    renderApps();

  }
);


clearSearch.addEventListener(
  "click",
  ()=>{

    search.value="";

    clearSearch.style.display=
    "none";

    currentIndex=0;

    renderApps();

    search.focus();

  }
);


/* =========================================================
   CLAVIER
========================================================= */

document.addEventListener(
  "keydown",
  event=>{

    if(
      document.activeElement===
      search
      &&
      event.key!=="Escape"
    ){

      return;

    }


    switch(event.key){

      case "ArrowDown":

        event.preventDefault();

        moveSelection(1);

        break;


      case "ArrowUp":

        event.preventDefault();

        moveSelection(-1);

        break;


      case "Enter":

        event.preventDefault();

        if(
          filteredApps.length
        ){

          launchApp(
            filteredApps[
              currentIndex
            ]
          );

        }

        break;


      case "Escape":

        event.preventDefault();

        goHome();

        break;

    }

  }
);


/* =========================================================
   ACCUEIL
========================================================= */

function goHome(){

  search.value="";

  clearSearch.style.display=
  "none";

  currentCategory=
  "Toutes";

  currentIndex=0;

  renderCategories();

  renderApps();

}


homeBtn.addEventListener(
  "click",
  goHome
);


/* =========================================================
   THEME
========================================================= */

const themes=[
  "default",
  "light",
  "neon"
];


function applyTheme(theme){

  document.body.classList.remove(
    "light",
    "neon"
  );


  if(theme==="light"){

    document.body.classList.add(
      "light"
    );

    themeBtn.textContent=
    "🌙";

  }

  else if(theme==="neon"){

    document.body.classList.add(
      "neon"
    );

    themeBtn.textContent=
    "🌈";

  }

  else{

    themeBtn.textContent=
    "☀️";

  }


  localStorage.setItem(
    "digitalHubTheme",
    theme
  );

}


function cycleTheme(){

  const current=
  localStorage.getItem(
    "digitalHubTheme"
  )
  ||
  "default";


  let index=
  themes.indexOf(current);


  index=
  (index+1)
  %
  themes.length;


  applyTheme(
    themes[index]
  );


  playTone(
    600,
    .05,
    "sine",
    .035
  );

}


themeBtn.addEventListener(
  "click",
  cycleTheme
);


applyTheme(
  localStorage.getItem(
    "digitalHubTheme"
  )
  ||
  "default"
);


/* =========================================================
   PLEIN ECRAN
========================================================= */

fullscreenBtn.addEventListener(
  "click",
  async()=>{

    try{

      if(!document.fullscreenElement){

        await document.documentElement
        .requestFullscreen();

        fullscreenBtn.textContent=
        "🡼";

        showToast(
          "⛶ Mode plein écran activé"
        );

      }

      else{

        await document.exitFullscreen();

        fullscreenBtn.textContent=
        "⛶";

      }

    }

    catch(_){

      showToast(
        "Le plein écran n'est pas disponible"
      );

    }

  }
);


document.addEventListener(
  "fullscreenchange",
  ()=>{

    fullscreenBtn.textContent=
    document.fullscreenElement
    ?"🡼"
    :"⛶";

  }
);


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

  toast.textContent=
  message;

  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer=
  setTimeout(
    ()=>{

      toast.classList.remove(
        "show"
      );

    },
    1800
  );

}


/* =========================================================
   AUDIO
========================================================= */

let audioContext=null;


function getAudio(){

  if(!audioContext){

    audioContext=
    new(
      window.AudioContext||
      window.webkitAudioContext
    )();

  }

  return audioContext;

}


function playTone(
  frequency,
  duration,
  type,
  volume
){

  try{

    const ctx=
    getAudio();


    if(
      ctx.state==="suspended"
    ){

      ctx.resume();

    }


    const oscillator=
    ctx.createOscillator();


    const gain=
    ctx.createGain();


    oscillator.type=
    type||"sine";


    oscillator.frequency.value=
    frequency;


    gain.gain.setValueAtTime(
      volume||.03,
      ctx.currentTime
    );


    gain.gain.exponentialRampToValueAtTime(
      .001,
      ctx.currentTime+
      duration
    );


    oscillator.connect(gain);

    gain.connect(
      ctx.destination
    );


    oscillator.start();


    oscillator.stop(
      ctx.currentTime+
      duration
    );

  }

  catch(_){}

}


/* =========================================================
   PARTICULES
========================================================= */

const canvas=
document.getElementById(
  "particles"
);

const ctx=
canvas.getContext(
  "2d"
);


let particles=[];

let animationFrame;


function resizeCanvas(){

  canvas.width=
  window.innerWidth;

  canvas.height=
  window.innerHeight;

}


window.addEventListener(
  "resize",
  ()=>{
    resizeCanvas();
    createParticles();
  }
);


function createParticles(){

  particles=[];


  const count=
  window.innerWidth<600
  ?25
  :50;


  for(
    let i=0;
    i<count;
    i++
  ){

    particles.push({

      x:
      Math.random()*
      canvas.width,

      y:
      Math.random()*
      canvas.height,

      radius:
      Math.random()*
      1.5+.3,

      dx:
      (Math.random()-.5)*.22,

      dy:
      (Math.random()-.5)*.22

    });

  }

}


function drawParticles(){

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  particles.forEach(
    particle=>{

      particle.x+=
      particle.dx;

      particle.y+=
      particle.dy;


      if(
        particle.x<0||
        particle.x>canvas.width
      ){

        particle.dx*=-1;

      }


      if(
        particle.y<0||
        particle.y>canvas.height
      ){

        particle.dy*=-1;

      }


      ctx.beginPath();


      ctx.arc(
        particle.x,
        particle.y,
        particle.radius,
        0,
        Math.PI*2
      );


      ctx.fillStyle=
      "rgba(255,255,255,.32)";


      ctx.fill();

    }
  );


  animationFrame=
  requestAnimationFrame(
    drawParticles
  );

}


resizeCanvas();

createParticles();

drawParticles();


/* =========================================================
   VISIBILITY
========================================================= */

document.addEventListener(
  "visibilitychange",
  ()=>{

    if(document.hidden){

      cancelAnimationFrame(
        animationFrame
      );

    }

    else{

      drawParticles();

    }

  }
);
