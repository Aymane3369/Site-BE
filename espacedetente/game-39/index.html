<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎵 Mon Player</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet" />
    <style>
        /* ---------- RESET & BASE ---------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", sans-serif;
            background: #0b0b12;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        /* ---------- VARIABLES ---------- */
        :root {
            --bg-primary: #12121e;
            --bg-secondary: #1a1a2e;
            --bg-card: rgba(26, 26, 46, 0.75);
            --text-primary: #f0f0f5;
            --text-secondary: #a0a0b8;
            --accent-1: #a855f7;
            --accent-2: #6366f1;
            --accent-3: #ec4899;
            --shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            --radius: 24px;
            --radius-sm: 14px;
            --transition: 0.35s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* ---------- GLASS CARD ---------- */
        .player {
            width: 100%;
            max-width: 440px;
            background: var(--bg-card);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border-radius: var(--radius);
            padding: 28px 24px 24px;
            box-shadow: var(--shadow);
            border: 1px solid rgba(255, 255, 255, 0.04);
            position: relative;
            overflow: hidden;
            transition: var(--transition);
        }

        .player::before {
            content: "";
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle at 30% 20%, rgba(168, 85, 247, 0.08), transparent 60%),
                radial-gradient(circle at 70% 80%, rgba(99, 102, 241, 0.06), transparent 50%);
            pointer-events: none;
            z-index: 0;
        }

        /* ---------- HEADER ---------- */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            position: relative;
            z-index: 1;
        }

        .header h1 {
            font-size: 22px;
            font-weight: 700;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2), var(--accent-3));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            letter-spacing: -0.5px;
        }

        .header .badge {
            font-size: 11px;
            font-weight: 600;
            color: var(--text-secondary);
            background: rgba(255, 255, 255, 0.05);
            padding: 4px 14px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        /* ---------- PLAYLIST ---------- */
        .playlist {
            position: relative;
            z-index: 1;
            margin-bottom: 20px;
            max-height: 320px;
            overflow-y: auto;
            padding-right: 4px;
            scrollbar-width: thin;
            scrollbar-color: rgba(168, 85, 247, 0.3) transparent;
        }

        .playlist::-webkit-scrollbar {
            width: 4px;
        }
        .playlist::-webkit-scrollbar-track {
            background: transparent;
        }
        .playlist::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.35);
            border-radius: 100px;
        }

        .song-item {
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 10px 14px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: var(--transition);
            border: 1px solid transparent;
            margin-bottom: 4px;
            background: transparent;
        }

        .song-item:hover {
            background: rgba(255, 255, 255, 0.04);
            border-color: rgba(255, 255, 255, 0.04);
        }

        .song-item.active {
            background: rgba(168, 85, 247, 0.12);
            border-color: rgba(168, 85, 247, 0.2);
        }

        .song-item .index {
            font-size: 13px;
            font-weight: 600;
            color: var(--text-secondary);
            min-width: 26px;
            text-align: center;
        }

        .song-item.active .index {
            color: var(--accent-1);
        }

        .song-item .info {
            flex: 1;
            min-width: 0;
        }

        .song-item .info .title {
            font-size: 15px;
            font-weight: 500;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-item .info .artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .song-item .play-indicator {
            font-size: 14px;
            color: var(--accent-1);
            opacity: 0;
            transition: var(--transition);
        }

        .song-item.active .play-indicator {
            opacity: 1;
        }

        /* ---------- NOW PLAYING BAR ---------- */
        .now-playing {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 14px;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: var(--radius-sm);
            border: 1px solid rgba(255, 255, 255, 0.04);
            margin-bottom: 16px;
            cursor: pointer;
            transition: var(--transition);
        }

        .now-playing:hover {
            background: rgba(255, 255, 255, 0.06);
        }

        .now-playing .art {
            width: 48px;
            height: 48px;
            border-radius: 12px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 22px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            box-shadow: 0 4px 16px rgba(168, 85, 247, 0.25);
            transition: var(--transition);
        }

        .now-playing .meta {
            flex: 1;
            min-width: 0;
        }

        .now-playing .meta .title {
            font-size: 15px;
            font-weight: 600;
            color: var(--text-primary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .now-playing .meta .artist {
            font-size: 12px;
            color: var(--text-secondary);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ---------- CONTROLS ---------- */
        .controls {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            padding: 8px 0 2px;
        }

        .controls .ctrl-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 20px;
            cursor: pointer;
            transition: var(--transition);
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(255, 255, 255, 0.02);
        }

        .controls .ctrl-btn:hover {
            color: var(--text-primary);
            background: rgba(255, 255, 255, 0.06);
        }

        .controls .ctrl-btn.play-btn {
            width: 56px;
            height: 56px;
            font-size: 26px;
            background: linear-gradient(135deg, var(--accent-1), var(--accent-2));
            color: #fff;
            box-shadow: 0 6px 24px rgba(168, 85, 247, 0.35);
        }

        .controls .ctrl-btn.play-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 32px rgba(168, 85, 247, 0.45);
        }

        .controls .ctrl-btn.play-btn.paused {
            background: linear-gradient(135deg, var(--accent-2), var(--accent-3));
            box-shadow: 0 6px 24px rgba(99, 102, 241, 0.35);
        }

        /* ---------- PROGRESS ---------- */
        .progress-wrap {
            position: relative;
            z-index: 1;
            display: flex;
            align-items: center;
            gap: 12px;
            margin: 16px 0 6px;
        }

        .progress-wrap .time {
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            min-width: 40px;
            font-variant-numeric: tabular-nums;
        }

        .progress-wrap .time:last-child {
            text-align: right;
        }

        .progress-track {
            flex: 1;
            height: 4px;
            border-radius: 100px;
            background: rgba(255, 255, 255, 0.08);
            cursor: pointer;
            position: relative;
            transition: height 0.2s;
        }

        .progress-track:hover {
            height: 6px;
        }

        .progress-track .progress-fill {
            height: 100%;
            width: 0%;
            border-radius: 100px;
            background: linear-gradient(90deg, var(--accent-1), var(--accent-2));
            transition: width 0.1s linear;
            position: relative;
        }

        .progress-track .progress-fill::after {
            content: "";
            position: absolute;
            right: -6px;
            top: 50%;
            transform: translateY(-50%);
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent-1);
            box-shadow: 0 0 20px rgba(168, 85, 247, 0.5);
            opacity: 0;
            transition: var(--transition);
        }

        .progress-track:hover .progress-fill::after {
            opacity: 1;
        }

        /* ---------- EXTRA TOOLS ---------- */
        .tools {
            position: relative;
            z-index: 1;
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 10px;
        }

        .tools .tool-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 15px;
            cursor: pointer;
            padding: 4px 8px;
            border-radius: 8px;
            transition: var(--transition);
            opacity: 0.5;
        }

        .tools .tool-btn:hover {
            opacity: 1;
            color: var(--text-primary);
        }

        .tools .tool-btn.active {
            opacity: 1;
            color: var(--accent-1);
        }

        /* ---------- RESPONSIVE ---------- */
        @media (max-width: 480px) {
            .player {
                padding: 20px 16px 18px;
                border-radius: 20px;
            }
            .header h1 {
                font-size: 19px;
            }
            .song-item {
                padding: 8px 10px;
            }
            .song-item .info .title {
                font-size: 14px;
            }
            .controls .ctrl-btn {
                width: 38px;
                height: 38px;
                font-size: 17px;
            }
            .controls .ctrl-btn.play-btn {
                width: 50px;
                height: 50px;
                font-size: 22px;
            }
            .now-playing .art {
                width: 40px;
                height: 40px;
                font-size: 18px;
            }
        }

        /* ---------- ANIMATIONS ---------- */
        @keyframes pulse-glow {
            0%,
            100% {
                box-shadow: 0 0 20px rgba(168, 85, 247, 0.2);
            }
            50% {
                box-shadow: 0 0 40px rgba(168, 85, 247, 0.4);
            }
        }

        .now-playing.active .art {
            animation: pulse-glow 2s ease-in-out infinite;
        }

        /* ---------- SCROLLBAR GLOBAL ---------- */
        ::-webkit-scrollbar {
            width: 4px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(168, 85, 247, 0.3);
            border-radius: 100px;
        }
    </style>
</head>
<body>

    <div class="player" id="app">
        <!-- HEADER -->
        <div class="header">
            <h1>♫ Mon Player</h1>
            <span class="badge">🎧 Live</span>
        </div>

        <!-- PLAYLIST -->
        <div class="playlist" id="playlist"></div>

        <!-- NOW PLAYING (mini) -->
        <div class="now-playing" id="nowPlaying" onclick="toggleExpand()">
            <div class="art" id="miniArt">🎵</div>
            <div class="meta">
                <div class="title" id="miniTitle">Aucune chanson</div>
                <div class="artist" id="miniArtist">—</div>
            </div>
            <i class="fa fa-chevron-right" style="color:var(--text-secondary);font-size:14px;opacity:0.4;"></i>
        </div>

        <!-- PROGRESS -->
        <div class="progress-wrap">
            <span class="time" id="currentTime">0:00</span>
            <div class="progress-track" id="progressTrack">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <span class="time" id="totalTime">0:00</span>
        </div>

        <!-- CONTROLS -->
        <div class="controls">
            <button class="ctrl-btn" onclick="prevSong()" title="Précédent">
                <i class="fa fa-step-backward"></i>
            </button>
            <button class="ctrl-btn play-btn" id="mainPlayBtn" onclick="togglePlay()" title="Lecture / Pause">
                <i class="fa fa-play" id="playIcon"></i>
            </button>
            <button class="ctrl-btn" onclick="nextSong()" title="Suivant">
                <i class="fa fa-step-forward"></i>
            </button>
        </div>

        <!-- TOOLS -->
        <div class="tools">
            <button class="tool-btn" id="shuffleBtn" onclick="toggleShuffle()" title="Aléatoire">
                <i class="fa fa-random"></i>
            </button>
            <button class="tool-btn" id="repeatBtn" onclick="toggleRepeat()" title="Répéter">
                <i class="fa fa-repeat"></i>
            </button>
        </div>
    </div>

    <script>
        // ============================================================
        //  PLAYLIST – 9 titres avec des extraits audio libres SoundHelix
        // ============================================================
        const songs = [{
            id: 0,
            title: "Lueur d'azur",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3",
            emoji: "🌊"
        }, {
            id: 1,
            title: "Horizon perdu",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3",
            emoji: "🌅"
        }, {
            id: 2,
            title: "Éclats de lune",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3",
            emoji: "🌙"
        }, {
            id: 3,
            title: "Rivière de nuit",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-4.mp3",
            emoji: "🌌"
        }, {
            id: 4,
            title: "Cendres d'étoiles",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-5.mp3",
            emoji: "✨"
        }, {
            id: 5,
            title: "Vent du large",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-6.mp3",
            emoji: "🍃"
        }, {
            id: 6,
            title: "Mirage argenté",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-7.mp3",
            emoji: "💎"
        }, {
            id: 7,
            title: "Flamme nocturne",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-8.mp3",
            emoji: "🔥"
        }, {
            id: 8,
            title: "Songe infini",
            artist: "SoundHelix",
            url: "https://www.soundhelix.com/examples/mp3/SoundHelix-Song-9.mp3",
            emoji: "🪐"
        }];

        // ============================================================
        //  ÉTAT
        // ============================================================
        let currentIndex = 0;
        let isPlaying = false;
        let isShuffle = false;
        let isRepeat = false;
        let progressInterval = null;

        const audio = new Audio();
        const playIcon = document.getElementById('playIcon');
        const mainPlayBtn = document.getElementById('mainPlayBtn');
        const progressFill = document.getElementById('progressFill');
        const progressTrack = document.getElementById('progressTrack');
        const currentTimeEl = document.getElementById('currentTime');
        const totalTimeEl = document.getElementById('totalTime');
        const playlistEl = document.getElementById('playlist');
        const miniTitle = document.getElementById('miniTitle');
        const miniArtist = document.getElementById('miniArtist');
        const miniArt = document.getElementById('miniArt');
        const nowPlayingEl = document.getElementById('nowPlaying');

        // ============================================================
        //  RENDU DE LA PLAYLIST
        // ============================================================
        function renderPlaylist() {
            playlistEl.innerHTML = '';
            songs.forEach((song, idx) => {
                const div = document.createElement('div');
                div.className = `song-item ${idx === currentIndex ? 'active' : ''}`;
                div.innerHTML = `
              <span class="index">${idx + 1}</span>
              <div class="info">
                <div class="title">${song.emoji} ${song.title}</div>
                <div class="artist">${song.artist}</div>
              </div>
              <span class="play-indicator">${idx === currentIndex && isPlaying ? '▶' : ''}</span>
            `;
                div.addEventListener('click', () => playSong(idx));
                playlistEl.appendChild(div);
            });
        }

        function updatePlaylistActive() {
            const items = playlistEl.querySelectorAll('.song-item');
            items.forEach((item, idx) => {
                item.classList.toggle('active', idx === currentIndex);
                const indicator = item.querySelector('.play-indicator');
                if (indicator) {
                    indicator.textContent = (idx === currentIndex && isPlaying) ? '▶' : '';
                }
            });
        }

        // ============================================================
        //  LECTURE
        // ============================================================
        function playSong(index) {
            if (index < 0 || index >= songs.length) return;
            currentIndex = index;
            const song = songs[currentIndex];
            audio.src = song.url;
            audio.load();
            audio.play().catch(() => {});
            isPlaying = true;
            updateUI();
            renderPlaylist();
            updatePlaylistActive();
            startProgress();
            // Met à jour le mini-player
            miniTitle.textContent = `${song.emoji} ${song.title}`;
            miniArtist.textContent = song.artist;
            miniArt.textContent = song.emoji;
            nowPlayingEl.classList.add('active');
            mainPlayBtn.classList.remove('paused');
            playIcon.className = 'fa fa-pause';
        }

        function togglePlay() {
            if (!audio.src) {
                playSong(currentIndex);
                return;
            }
            if (isPlaying) {
                audio.pause();
                isPlaying = false;
                mainPlayBtn.classList.add('paused');
                playIcon.className = 'fa fa-play';
                clearInterval(progressInterval);
            } else {
                audio.play().catch(() => {});
                isPlaying = true;
                mainPlayBtn.classList.remove('paused');
                playIcon.className = 'fa fa-pause';
                startProgress();
            }
            updatePlaylistActive();
            updateMiniIndicator();
        }

        function nextSong() {
            let next = currentIndex + 1;
            if (isShuffle) {
                do {
                    next = Math.floor(Math.random() * songs.length);
                } while (next === currentIndex && songs.length > 1);
            } else if (next >= songs.length) {
                next = 0;
            }
            playSong(next);
        }

        function prevSong() {
            let prev = currentIndex - 1;
            if (isShuffle) {
                do {
                    prev = Math.floor(Math.random() * songs.length);
                } while (prev === currentIndex && songs.length > 1);
            } else if (prev < 0) {
                prev = songs.length - 1;
            }
            playSong(prev);
        }

        // ============================================================
        //  PROGRESS
        // ============================================================
        function startProgress() {
            clearInterval(progressInterval);
            progressInterval = setInterval(() => {
                if (!audio.duration) return;
                const pct = (audio.currentTime / audio.duration) * 100;
                progressFill.style.width = pct + '%';
                currentTimeEl.textContent = formatTime(audio.currentTime);
                totalTimeEl.textContent = formatTime(audio.duration);
            }, 200);
        }

        function formatTime(sec) {
            if (!sec || isNaN(sec)) return '0:00';
            const m = Math.floor(sec / 60);
            const s = Math.floor(sec % 60);
            return `${m}:${s.toString().padStart(2, '0')}`;
        }

        // Clic sur la barre de progression
        progressTrack.addEventListener('click', (e) => {
            if (!audio.duration) return;
            const rect = progressTrack.getBoundingClientRect();
            const x = (e.clientX - rect.left) / rect.width;
            audio.currentTime = x * audio.duration;
        });

        // ============================================================
        //  EVENEMENTS AUDIO
        // ============================================================
        audio.addEventListener('ended', () => {
            if (isRepeat) {
                audio.currentTime = 0;
                audio.play().catch(() => {});
                return;
            }
            nextSong();
        });

        audio.addEventListener('loadedmetadata', () => {
            totalTimeEl.textContent = formatTime(audio.duration);
        });

        audio.addEventListener('play', () => {
            isPlaying = true;
            mainPlayBtn.classList.remove('paused');
            playIcon.className = 'fa fa-pause';
            updatePlaylistActive();
            updateMiniIndicator();
            startProgress();
        });

        audio.addEventListener('pause', () => {
            isPlaying = false;
            mainPlayBtn.classList.add('paused');
            playIcon.className = 'fa fa-play';
            updatePlaylistActive();
            updateMiniIndicator();
            clearInterval(progressInterval);
        });

        // ============================================================
        //  UI MISE À JOUR
        // ============================================================
        function updateUI() {
            const song = songs[currentIndex];
            if (song) {
                miniTitle.textContent = `${song.emoji} ${song.title}`;
                miniArtist.textContent = song.artist;
                miniArt.textContent = song.emoji;
                nowPlayingEl.classList.add('active');
            }
            mainPlayBtn.classList.toggle('paused', !isPlaying);
            playIcon.className = isPlaying ? 'fa fa-pause' : 'fa fa-play';
            updatePlaylistActive();
        }

        function updateMiniIndicator() {
            const items = playlistEl.querySelectorAll('.song-item');
            items.forEach((item, idx) => {
                const indicator = item.querySelector('.play-indicator');
                if (indicator) {
                    indicator.textContent = (idx === currentIndex && isPlaying) ? '▶' : '';
                }
            });
        }

        // ============================================================
        //  SHUFFLE / REPEAT
        // ============================================================
        function toggleShuffle() {
            isShuffle = !isShuffle;
            document.getElementById('shuffleBtn').classList.toggle('active', isShuffle);
        }

        function toggleRepeat() {
            isRepeat = !isRepeat;
            document.getElementById('repeatBtn').classList.toggle('active', isRepeat);
        }

        // ============================================================
        //  EXPAND (simule un agrandissement – ici simple toggle de classe)
        // ============================================================
        function toggleExpand() {
            nowPlayingEl.classList.toggle('expanded');
            // Petit effet visuel supplémentaire
        }

        // ============================================================
        //  INIT
        // ============================================================
        renderPlaylist();
        // Charge la première chanson sans la jouer
        const first = songs[0];
        miniTitle.textContent = `${first.emoji} ${first.title}`;
        miniArtist.textContent = first.artist;
        miniArt.textContent = first.emoji;
        audio.src = first.url;
        audio.load();
        currentIndex = 0;
        updateUI();
        mainPlayBtn.classList.add('paused');
        playIcon.className = 'fa fa-play';

        // Petit délai pour afficher la durée
        setTimeout(() => {
            if (audio.duration) {
                totalTimeEl.textContent = formatTime(audio.duration);
            }
        }, 500);

        console.log('🎵 Mon Player — prêt !');
        console.log('💡 Clique sur une chanson pour lancer la lecture.');
    </script>

</body>
</html>
